}
.feedback-alert{ animation:pulseAlert 1.6s infinite; }

<script>
const SUPABASE_URL='https://sncwehwxrbntcyklkshh.supabase.co';
const SUPABASE_KEY='sb_publishable_OW_O-vzSCHm_mM1Zu-ffvw_sjAs8zNv';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.storage = {
  async get(key){
    const { data, error } = await supabaseClient.from('app_storage').select('value').eq('key', key).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('not found');
    return { key: key, value: data.value };
  },
  async set(key, value){
    const { error } = await supabaseClient.from('app_storage').upsert({ key: key, value: value }, { onConflict: 'key' });
    if (error) throw error;
    return { key: key, value: value };
  },
  async delete(key){
    const { error } = await supabaseClient.from('app_storage').delete().eq('key', key);
    if (error) throw error;
    return { key: key, deleted: true };
  }
};
// Connexion sécurisée du compte administrateur (nécessaire pour modifier les allergènes)
window.agAuth = {
  async status(){ const r = await supabaseClient.auth.getSession(); return (r.data && r.data.session) ? r.data.session.user.email : null; },
  async signIn(email, password){ const r = await supabaseClient.auth.signInWithPassword({ email: email, password: password }); if (r.error) throw r.error; return r.data.user.email; },
  async signOut(){ await supabaseClient.auth.signOut(); }
};
// Appels de fonctions serveur (vérification des codes, gestion des accès)
window.appRpc = async function(fn, args){
  const r = await supabaseClient.rpc(fn, args || {});
  if (r.error) throw r.error;
  return r.data;
};
</script>

    { id:'proc-3', title:'Procédure de remboursement', content:'Les feuilles de fiche de remboursement sont disponibles dans le porte-vue bleu, dans le tiroir du bar.\n\nIl faut :\n\n• Compléter les informations demandées et donner le maximum de renseignements sur ce qu\'il s\'est produit.\n• Joindre l\'addition réimprimée et le duplicata du ticket CB.\n• Déposer le document rempli sur le bureau de l\'Income.\n\nAttention : il faut saisir en caisse le montant qui aurait dû être encaissé, et pas celui réellement débité. Cela permet de voir l\'écart en banque.' },

      {title:'Carte de fidélité Disloyalty – boisson barista', offert:'Oui', explication:'Une boisson barista au choix est offerte chaque jour sur présentation de la carte Disloyalty au bar. Pas plus d\'une par jour.', aFaire:'Vérifier que la carte Disloyalty est valide et non une capture d\'écran, voir la validation par le guest, offrir une boisson barista, noter le n° de la carte (#...) lors du posting en Disloyalty.'},

      {title:'VOUMAMA', offert:'Oui', explication:'Voucher prépayé par le client ou un tiers (ex : 2 brunchs offerts). Édité par la réception, envoyé au client. Support papier épais.', aFaire:'Récupérer le document, vérifier la validité à la réception de l\'hôtel avant le départ du client.\n\nSi valide → le manager poste sur PM VOUCHER FNB 9015.\nSi expiré ou déjà utilisé → le client règle.\n\nContrôler que la valeur du Voucher couvre la consommation :\nExemple : Conso de 89€, Voucher de 84€ = le client doit régler les 5€ manquants.\n\nPréciser à Céline Marmet dans son duty du jour le numéro de la promotion (indiqué sur le document) et conserver le voucher dans l\'enveloppe du jour. Il devra être joint dans le Night Package.'},
      {title:'COMMAMA', offert:'Oui', explication:'Offert commercial émis par la direction.', aFaire:'Récupérer le document, vérifier la validité à la réception avant le départ du client.\nSi valide → le manager poste en OFFERT COM. Préciser à Céline Marmet dans son duty du jour le numéro de la promotion (indiqué sur le document) et conserver le voucher dans l\'enveloppe du jour.'},
      {title:'Bon cocktail - offres Staycation / Lovoff', offert:'Oui', explication:'2 cocktails à 12€ inclus dans l\'offre. Le client peut choisir un cocktail plus cher et payer la différence. Bon cocktail date limite.', aFaire:'Vérifier le bon cocktail et sa date de validité. Appliquer 12€ de réduction sur le cocktail, et faire payer la différence si existante (divers).'},
      {title:'Bon boisson offert - geste commercial / plainte', offert:'Oui', explication:'Un bon est remis en geste commercial avec mention "offert / geste commercial", valable jusqu\'à une date définie. Si la boisson dépasse 12€, le client paie la différence.', aFaire:'Vérifier le bon cocktail et sa date de validité. Appliquer 12€ de réduction sur la boisson, la poster dans la bonne catégorie, et faire payer la différence si existante (divers).'},

  function icon(name, size){
    size = size || 20;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="'+size+'" height="'+size+'" style="display:block">'+(ICONS[name]||'')+'</svg>';
  }
  function iconBadge(name, bg, fg){
    const ringColor = bg === '#fff' || bg === '#FFFFFF' ? 'rgba(26,26,26,0.18)' : bg+'4D';
    return '<div style="width:48px;height:48px;border-radius:50%;border:2.5px dashed '+ringColor+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+
      '<div style="width:38px;height:38px;border-radius:50%;background:'+bg+';color:'+fg+';display:flex;align-items:center;justify-content:center">'+icon(name,19)+'</div>'+

  function todayKey(){ return new Date().toISOString().slice(0,10); }
  // Renvoie la date du mardi le plus récent (aujourd'hui inclus) : sert de clé pour les
  // checklists dont la progression doit rester partagée toute la semaine, jusqu'à
  // la remise à zéro automatique du mardi suivant.
  function weekKeyTuesday(){
    const d = new Date();
    const day = d.getDay(); // 0=dimanche, 1=lundi, 2=mardi, ...
    let diff = day - 2;
    if (diff < 0) diff += 7;
    const tuesday = new Date(d);
    tuesday.setDate(d.getDate() - diff);
    return tuesday.toISOString().slice(0,10);
  }
  // Sous-lieux dont la progression de checklist doit être partagée sur toute la semaine
  // (plutôt que remise à zéro chaque jour), avec reset automatique chaque mardi.
  const WEEKLY_SHARED_PROGRESS_SUBLIEUX = ['nettoyage-hebdo'];
  // Semaine du Night : du samedi au mercredi (jours travaillés). La checklist est remise à zéro le jeudi
  // à midi : une fois la nuit du mercredi terminée (elle déborde après minuit, une remise à zéro à minuit
  // ferait perdre la progression en pleine nuit). La nouvelle liste est ainsi prête pour le samedi.
  // Dates en heure locale (pas UTC).
  const NIGHT_RESET_DAY = 4;     // jeudi
  const NIGHT_RESET_HOUR = 12;   // midi
  function localDateKey(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function nightCycleStartDate(){
    // On recule de 12 h pour que « le jour » change à midi, puis on remonte jusqu'au jeudi.
    const d = new Date(Date.now() - NIGHT_RESET_HOUR*3600*1000);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay() - NIGHT_RESET_DAY + 7) % 7));
    return d;
  }
  function nightWeekKey(){ return localDateKey(nightCycleStartDate()); }
  function nightWeekRangeLabel(){
    const start = nightCycleStartDate();
    const sat = new Date(start); sat.setDate(start.getDate() + 2);
    const wed = new Date(start); wed.setDate(start.getDate() + 6);
    function fmt(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
    return 'du samedi '+fmt(sat)+' au mercredi '+fmt(wed);
  }
  // Jeudi (après la remise à zéro) et vendredi : la nouvelle liste est prête et démarre samedi.
  function isNightWeekFresh(){
    const start = nightCycleStartDate();
    const today = new Date(); today.setHours(0,0,0,0);
    const days = Math.round((today - start) / 86400000);
    return days >= 0 && days < 2;
  }
  function categoryIdOfSublieu(subId){
    const cats = (state.structure && state.structure.categories) || [];
    for (let i=0; i<cats.length; i++){
      if ((cats[i].sublieux||[]).some(function(s){ return s.id === subId; })) return cats[i].id;
    }
    return null;
  }
  function isNightSublieu(subId){ return categoryIdOfSublieu(subId) === 'night'; }
  function isWeeklyChecklist(subId){
    return WEEKLY_SHARED_PROGRESS_SUBLIEUX.indexOf(subId) >= 0 || isNightSublieu(subId);
  }

  // Sauvegardes automatiques de la structure (checklists) : on garde l'ancienne version
  // avant écrasement, au plus une toutes les 30 min, ou immédiatement si on perd des éléments.
  function structCount(st){
    let n=0; try{ (st.categories||[]).forEach(function(c){ n+=1+(c.sublieux||[]).length; }); }catch(e){}
    return n;
  }
  async function structureBackupsLoad(){
    try { const r = await window.storage.get('structureBackups', true); const a = JSON.parse(r.value); return Array.isArray(a)?a:[]; }
    catch(e){ return []; }
  }
  async function structureSnapshot(next){
    try {
      let prevRaw = null;
      try { const r = await window.storage.get('structure', true); prevRaw = r.value; } catch(e){ return; }
      if (!prevRaw) return;
      const prev = JSON.parse(prevRaw);
      if (JSON.stringify(prev) === JSON.stringify(next)) return;
      const list = await structureBackupsLoad();
      const last = list.length ? list[list.length-1] : null;
      const lost = structCount(next) < structCount(prev);
      const old = !last || (Date.now() - last.t) > 30*60*1000;
      if (!lost && !old) return;
      list.push({ t:Date.now(), by:(state && state.name) || '', data:prev });
      while (list.length > 8) list.shift();
      await window.storage.set('structureBackups', JSON.stringify(list), true);
    } catch(e){ console.error('Sauvegarde structure impossible', e); }
  }
  let saveStructureTimer = null;
  async function saveStructure(s){
    if (saveStructureTimer) clearTimeout(saveStructureTimer);
    saveStructureTimer = setTimeout(async function(){
      try {
        await structureSnapshot(s);
        await window.storage.set('structure', JSON.stringify(s), true);
      } catch(e){
        console.error('Erreur sauvegarde structure (sera retentée au prochain changement):', e);
      }
      saveStructureTimer = null;
    }, 350);
    // Résout immédiatement : l'affichage utilise déjà l'état en mémoire à jour,
    // l'écriture réelle est regroupée en arrière-plan pour éviter les rafales de clics.
    return Promise.resolve();
  }
  function progressKey(sublieuId){
    if (isNightSublieu(sublieuId)) return 'progress:'+sublieuId+':nightweek-'+nightWeekKey();
    return WEEKLY_SHARED_PROGRESS_SUBLIEUX.indexOf(sublieuId) >= 0
      ? 'progress:'+sublieuId+':week-'+weekKeyTuesday()
      : 'progress:'+sublieuId+':'+todayKey();
  }
  async function getProgress(sublieuId){
    try {
      const res = await window.storage.get(progressKey(sublieuId), true);
      const p = JSON.parse(res.value);
      // Sécurité : si une checklist est encore marquée "validée" (résidu d'un ancien
      // enregistrement), on la remet à zéro immédiatement au lieu de l'afficher cochée.
      if (p.validated && !isNightSublieu(sublieuId)){
        const resetProgress = { checked: [], operator: null, validated: false, validatedAt: null, comment: '' };
        await setProgress(sublieuId, resetProgress);
        return resetProgress;
      }
      return p;
    } catch(e){
      return { checked: [], operator: null, validated: false, validatedAt: null, comment: '' };
    }
  }
  async function setProgress(sublieuId, p){
    await window.storage.set(progressKey(sublieuId), JSON.stringify(p), true);

  // ===== Mode cave (réseau faible) : les cochages de suivi de réqui sont mis en attente sur le téléphone =====
  const PENDING_KEY = 'cm_pending_requi_ops', REQ_CACHE_KEY = 'cm_requi_cache';
  function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  function readPending(){ return lsGet(PENDING_KEY, []); }
  function writeReqCache(list){ lsSet(REQ_CACHE_KEY, (list||[]).slice(0,60)); }
  function applyRequiOp(list, op){
    const r = list.find(function(x){ return x.id === op.reqId; });
    if (!r) return false;
    if (op.kind === 'validate'){ r.validation = r.validation || {}; r.validation[op.stage] = { by: op.by, at: op.at }; return true; }
    const p = r.products[op.idx];
    if (!p) return false;
    if (op.kind === 'uncheck') delete p[op.stage]; else p[op.stage] = { by: op.by, at: op.at, qty: String(op.qty) };
    return true;
  }
  function overlayPending(list){
    const ops = readPending();
    ops.forEach(function(o){ applyRequiOp(list, o); });
    return list;
  }
  let _flushing = false;
  async function flushPending(){
    const ops = readPending();
    if (!ops.length || _flushing) return;
    _flushing = true;
    try {
      const list = await getRequisitions(true);
      ops.forEach(function(o){ applyRequiOp(list, o); });
      await window.storage.set('requisitions', JSON.stringify(list.slice(0,2000)), true);
      writeReqCache(list);
      const sentIds = ops.map(function(o){ return o.n; });
      lsSet(PENDING_KEY, readPending().filter(function(o){ return sentIds.indexOf(o.n) < 0; }));
      if (String(state.screen).indexOf('requi') === 0 || String(state.screen).indexOf('econome-') === 0){ state.requisitions = overlayPending(list); }
      render();
    } catch(e){ /* toujours hors ligne : on garde la file */ }
    finally { _flushing = false; }
  }
  async function runRequiOp(op){
    await flushPending();
    op.n = Date.now() + '-' + Math.random().toString(36).slice(2,6);
    let list = null;
    try {
      list = await getRequisitions(true);
      if (!applyRequiOp(list, op)) return list;
      await window.storage.set('requisitions', JSON.stringify(list.slice(0,2000)), true);
      writeReqCache(list);
      return list;
    } catch(e){
      // pas de réseau : on garde l'action sur le téléphone, elle partira toute seule
      const cached = overlayPending(lsGet(REQ_CACHE_KEY, []));
      applyRequiOp(cached, op);
      lsSet(PENDING_KEY, readPending().concat([op]));
      return cached;
    }
  }

  function openPdfReliably(dataUrl, filename){
    try {
      const parts = dataUrl.split(',');
      const mimeMatch = parts[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
      const binary = atob(parts[1]);
      const bytes = new Uint8Array(binary.length);
      for (let i=0; i<binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
      const blob = new Blob([bytes], { type: mime });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename || 'document.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 60000);
    } catch(e){
      console.error('Erreur ouverture PDF:', e);
      window.open(dataUrl, '_blank');
    }
  }

  function compressImageDataUrl(dataUrl, maxWidth, quality){
    return new Promise(function(resolve){
      try {
        const img = new Image();
        img.onload = function(){
          let w = img.width, h = img.height;
          if (w > maxWidth){
            h = Math.round(h * (maxWidth / w));
            w = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ resolve(dataUrl); };
        img.src = dataUrl;
      } catch(e){ resolve(dataUrl); }
    });
  }

  async function restoreSessionSnapshot(){

      if (typeof sessionStorage === 'undefined') return false;
      const raw = sessionStorage.getItem(SESSION_SNAPSHOT_KEY);
      if (!raw) return false;
      const snap = JSON.parse(raw);
      // Une sauvegarde de plus de 10 minutes est jugée trop ancienne pour être restaurée automatiquement.
      if (!snap._ts || (Date.now() - snap._ts) > 10*60*1000) return false;
      const wasLoggedIn = snap.managerUnlocked || snap.economeUnlocked || snap.entertainmentUnlocked || snap.eventsUnlocked || snap.rhUnlocked || snap.techniqueUnlocked || snap.nightUnlocked || snap.adminUnlocked || snap.name;

      SESSION_SNAPSHOT_FIELDS.forEach(function(f){ if (snap[f] !== undefined) state[f] = snap[f]; });

      // Le fil d'actu (accueil / What's up) a besoin des événements : on les recharge toujours à la restauration.
      if (state.screen === 'home' || state.screen === 'whatsup'){
        const evAll = await Promise.all([getEvents(), getEventSheets(), getRhEvents()]);
        state.events = evAll[0]; state.eventSheets = evAll[1]; state.rhEvents = evAll[2];

    else if (action === 'openBarMessages'){
      state.barMessageError = '';
      const [msgs, gang] = await Promise.all([getBarMessages(false), getGangNames()]);
      state.barMessages = msgs;

      if (!names.length) names = gang.map(function(u){ return u.name; });

    }
    else if (action === 'sendBarMessage'){
      const to = document.getElementById('bm-to'), tx = document.getElementById('bm-text');

    else if (action === 'openRequiHub'){
      if (payload) state.requiHubFrom = payload;

    else if (action === 'requiHubForms'){

    else if (action === 'openRequiFormFromHub'){
      state.structure = await getStructureRaw();
      state.categoryId = payload.catId;
      state.sublieuId = payload.subId;

    else if (action === 'openRequiFollow'){
      await flushPending();

      state.followMode = payload || 'cave';
      state.followReqId = null;

      state.requisitions = overlayPending(await getRequisitions());

    else if (action === 'backRequiFollow'){
      state.followReqId = null;
      render();
    }
    else if (action === 'setRequiQty' || action === 'toggleRequiCheck' || action === 'validateRequiStage'){
      const who = state.name || (state.economeUnlocked ? 'Économe' : '');
      const at = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
      let op;
      if (action === 'validateRequiStage'){
        op = { kind:'validate', reqId: payload.id, stage: payload.stage, by: who, at: at };
      } else if (action === 'setRequiQty'){
        const v = String(payload.value == null ? '' : payload.value).trim();
        op = (v === '') ? { kind:'uncheck', reqId: payload.id, idx: payload.idx, stage: payload.stage }
                        : { kind:'set', reqId: payload.id, idx: payload.idx, stage: payload.stage, qty: v, by: who, at: at };
      } else {
        const cur = (state.requisitions || []).find(function(x){ return x.id === payload.id; });
        const cp = cur && cur.products[payload.idx];
        if (!cp) return;
        op = cp[payload.stage] ? { kind:'uncheck', reqId: payload.id, idx: payload.idx, stage: payload.stage }
                               : { kind:'set', reqId: payload.id, idx: payload.idx, stage: payload.stage, qty: String(cp.quantity), by: who, at: at };
      }
      const list = await runRequiOp(op);
      if (list) state.requisitions = list;

    else if (action === 'saveRequisition'){
      state.isSubmitting = true;
      state.submittingMessage = 'Envoi de la réqui...';
      renderKeep();
      const cat = findCategory(state.categoryId);
      const sub = findSublieu(state.categoryId, state.sublieuId);
      const now = new Date();
      const isRich = sub.products.length > 0 && typeof sub.products[0] === 'object';
      let products;
      if (isRich){
        captureCurrentFridgeInputs(sub);
        const draft = state.requisitionDraft || {};
        const byName = {};
        Object.keys(draft).forEach(function(key){
          const val = parseFloat((draft[key]||'').replace(',', '.'));
          if (!val) return;
          const sepIdx = key.indexOf('|');
          const loc = key.slice(0, sepIdx);
          const name = key.slice(sepIdx+1);
          if (!byName[name]){
            const ref = sub.products.find(function(p){ return p.name === name; });
            byName[name] = { name: name, unit: (ref && ref.unit) || '', locations: [], quantity: 0 };
          }
          byName[name].quantity += val;
          byName[name].locations.push(loc);
        });
        products = Object.keys(byName).map(function(name){
          const item = byName[name];
          return { name: item.name, location: item.locations.join(' + '), unit: item.unit, quantity: String(item.quantity) };
        });
      } else {
        products = sub.products.map(function(product, i){
          const input = document.getElementById('requi-input-'+i);
          const val = (input && input.value !== '') ? input.value.trim() : '0';
          return { name: product, quantity: val };
        }).filter(function(p){ return p.quantity && p.quantity !== '0'; });
      }
      const commentInput = document.getElementById('requisition-comment');
      await addRequisition({
        id: 'requi-'+Date.now(),
        operator: state.name || (state.economeUnlocked ? 'Économe' : ''),
        categoryName: cat.name,
        sublieuName: sub.name,
        when: nowLabel(),
        dayKey: dayKeyOf(now),
        products: products,
        comment: commentInput ? commentInput.value.trim() : ''
      });
      state.requisitionSaved = true;
      state.requisitionDraft = {};
      state.requisitionFridgeIndex = 0;
      state.isSubmitting = false;
      render();
    }
    else if (action === 'backToSublieux'){
      state.structure = await getStructureRaw();
      if (state.categoryId === 'night' && state.nightUnlocked){
        state.nightProgress = await loadNightProgress();
        state.screen = 'night';
      } else {
        state.screen = (state.categoryId === 'fermeture') ? 'fermeture' : 'home';
      }
      render();
    }
    else if (action === 'toggleTask'){
      const subId = state.sublieuId;
      const p = state.progress[subId];
      if (p.validated) return;
      const idx = p.checked.indexOf(payload);
      if (idx>=0) p.checked.splice(idx,1); else p.checked.push(payload);
      render();
      setProgress(subId, p);
    }
    else if (action === 'saveComment'){
      const subId = state.sublieuId;
      const p = state.progress[subId];
      const textarea = document.getElementById('checklist-comment');
      p.comment = textarea ? textarea.value : p.comment;
      await setProgress(subId, p);
    }
    else if (action === 'validate'){
      const subId = state.sublieuId;
      const sub = findSublieu(state.categoryId, subId);
      const p = state.progress[subId];
      const allChecked = sub.tasks.length > 0 && countChecked(sub, p) === sub.tasks.length;
      if (!allChecked){
        if (isWeeklyChecklist(subId)){
          // Pas de "valider quand même" pour une checklist à progression partagée sur la semaine :
          // tant qu'elle n'est pas complète, elle reste simplement en attente.
          state.weeklyIncompleteError = true;
          render();
          return;
        }
        state.confirmValidateAnyway = true;
        render();
        return;
      }
      state.weeklyIncompleteError = false;
      await doValidateChecklist();

    else if (action === 'confirmValidateAnyway'){

    }
    else if (action === 'cancelValidateAnyway'){
      state.confirmValidateAnyway = false;
      render();
    }
    else if (action === 'deleteCategory'){
      // Suppression d'une zone entière désactivée (erreur de manipulation trop risquée).
      return;
    }
    else if (action === 'restoreCategory'){
      const id = payload;
      if (state.structure.categories.some(c=>c.id===id)) return;
      const list = await structureBackupsLoad();
      let src = null;
      for (let i=list.length-1;i>=0 && !src;i--){
        const f = (list[i].data.categories||[]).find(c=>c.id===id);
        if (f) src = f;
      }
      if (!src){
        // Pas de sauvegarde : on reconstruit les listes à partir des rapports déjà remplis
        // (chaque rapport contient la liste des tâches telle qu'elle était à ce moment-là).
        const def = DEFAULT_STRUCTURE.categories.find(c=>c.id===id);
        let hist = [];
        try { hist = await getHistorique(); } catch(e){}
        const ts = function(h){ const m = /^hist-(\d+)/.exec(h.id||''); return m ? +m[1] : 0; };
        const latest = {};
        (hist||[]).forEach(function(h){
          if (h.categoryId !== id || !h.tasksSnapshot || !h.tasksSnapshot.length) return;
          const k = h.sublieuName;
          if (!latest[k] || ts(h) > ts(latest[k])) latest[k] = h;
        });
        if (def){
          src = JSON.parse(JSON.stringify(def));
          src.sublieux.forEach(function(sl){
            const h = latest[sl.name];
            if (!h) return;
            const oldTasks = sl.tasks || [];
            sl.tasks = h.tasksSnapshot.map(function(t, i){
              const m = oldTasks.find(function(o){ return o.label === t.label; });
              return m ? JSON.parse(JSON.stringify(m)) : { id:'task-'+Date.now()+'-'+i, label:t.label };
            });
            delete latest[sl.name];
          });
          // Sous-lieux présents dans les rapports mais absents de la version d'origine
          Object.keys(latest).forEach(function(name, n){
            const h = latest[name];
            src.sublieux.push({ id:'restored-'+Date.now()+'-'+n, name:name, icon:'palette',
              tasks:h.tasksSnapshot.map(function(t,i){ return { id:'task-'+Date.now()+'-'+n+'-'+i, label:t.label }; }) });
          });
        }
      }
      if (!src) return;
      const defIdx = DEFAULT_STRUCTURE.categories.findIndex(c=>c.id===id);
      const at = Math.min(defIdx<0?state.structure.categories.length:defIdx, state.structure.categories.length);
      state.structure.categories.splice(at,0,JSON.parse(JSON.stringify(src)));
      await saveStructure(state.structure);
      render();
    }
    else if (action === 'deleteSublieu'){
      // Suppression d'un sous-lieu désactivée : seuls les éléments d'une liste sont supprimables.
      return;
    }
    else if (action === 'addTask'){
      const labelInput = document.getElementById('new-task-label-'+payload.catId+'-'+payload.subId);
      const label = (labelInput.value||'').trim();
      if (!label) return;
      const sub = findSublieu(payload.catId, payload.subId);
      sub.tasks.push({ id:'task-'+Date.now(), label:label });
      await saveStructure(state.structure);
      render();
    }
    else if (action === 'deleteTask'){
      const sub = findSublieu(payload.catId, payload.subId);
      sub.tasks = sub.tasks.filter(t=>t.id!==payload.taskId);
      await saveStructure(state.structure);
      render();
    }
    else if (action === 'startEditTask'){
      state.adminEditingTaskId = payload;
      render();
    }
    else if (action === 'cancelEditTask'){
      state.adminEditingTaskId = null;
      render();
    }
    else if (action === 'saveEditTask'){
      const input = document.getElementById('edit-task-input-'+payload.taskId);
      const newLabel = (input.value||'').trim();
      if (!newLabel) return;
      const sub = findSublieu(payload.catId, payload.subId);
      const task = sub.tasks.find(t=>t.id===payload.taskId);
      if (task) task.label = newLabel;
      state.adminEditingTaskId = null;
      await saveStructure(state.structure);
      render();
    }
    else if (action === 'moveTaskToPosition'){
      const sub = findSublieu(payload.catId, payload.subId);
      const idx = sub.tasks.findIndex(t=>t.id===payload.taskId);
      let target = (payload.position||1) - 1;
      if (target < 0) target = 0;
      if (target > sub.tasks.length-1) target = sub.tasks.length-1;
      if (idx >= 0 && target !== idx){
        const [item] = sub.tasks.splice(idx, 1);
        sub.tasks.splice(target, 0, item);
        await saveStructure(state.structure);
      }
      render();
    }
  };

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // Échappement dédié pour un texte injecté comme argument JS à l'intérieur d'un attribut onclick="...".
  // esc() seul ne suffit pas ici : un guillemet simple non protégé dans la chaîne JS pourrait
  // casser hors du littéral et permettre une injection de code (XSS stocké via un nom saisi par un manager).
  function escJs(s){
    return String(s)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '')
      .replace(/</g, '\\x3C')
      .replace(/"/g, '&quot;');
  }
  // Insère automatiquement les "/" pendant la saisie d'une date au format JJ/MM/AAAA,
  // pour permettre de taper directement au clavier sans ouvrir un calendrier.
  window.formatDateInput = function(el){
    const cursorWasAtEnd = el.selectionEnd === el.value.length;
    let digits = el.value.replace(/\D/g, '').slice(0, 8);
    let formatted = digits;
    if (digits.length > 4){
      formatted = digits.slice(0,2) + '/' + digits.slice(2,4) + '/' + digits.slice(4);
    } else if (digits.length > 2){
      formatted = digits.slice(0,2) + '/' + digits.slice(2);
    }
    el.value = formatted;
    if (cursorWasAtEnd && el.setSelectionRange){
      el.setSelectionRange(formatted.length, formatted.length);
    }
  };

  function screenNight(){
    const cat = state.structure.categories.find(function(c){ return c.id === 'night'; });
    const subs = cat ? cat.sublieux : [];
    const prog = state.nightProgress || {};
    const activeSubs = subs.filter(function(s){ return s.tasks.length > 0; });
    const validatedCount = activeSubs.filter(function(s){ return prog[s.id] && prog[s.id].validated; }).length;
    let out = '<div style="padding:16px 16px 4px">'+
      '<div style="position:relative;border-radius:20px;background:#2F3E7E;color:#fff;padding:20px 18px 18px;border:2.5px solid var(--border-strong,#000);box-shadow:4px 4px 0 var(--border-strong,#000)">'+

        '<div style="color:#fff;display:flex">'+icon('moon',30)+'</div>'+
        '<h1 class="mama-title" style="font-size:30px;line-height:1.1;color:#fff;margin:8px 0 10px;letter-spacing:1px">Night</h1>'+
        '<span style="display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:700">Semaine '+nightWeekRangeLabel()+'</span>'+
      '</div>'+
    '</div>';
    out += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 20px 0">'+
      '<span style="font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--text-secondary)">Mes checklists de la semaine</span>'+
      (activeSubs.length === 0 ? '' : '<span style="font-size:12px;font-weight:800;color:var(--text-primary)">'+validatedCount+'/'+activeSubs.length+' validée'+(validatedCount>1?'s':'')+'</span>')+
    '</div>';
    out += '<div style="padding:2px 20px 0;font-size:12px;color:var(--text-muted)">À terminer pour mercredi.'+
      (isNightWeekFresh() ? ' Nouvelle semaine : la liste est remise à zéro et démarre samedi.' : '')+
    '</div>';
    out += '<div style="padding:10px 16px;display:flex;flex-direction:column;gap:10px">';
    if (subs.length === 0){
      out += '<div style="padding:16px;color:var(--text-muted);font-size:14px;text-align:center">Aucune checklist à faire cette semaine pour l\'instant.</div>';
    }
    subs.forEach(function(sub){
      const p = prog[sub.id] || { checked: [], validated: false };
      const total = sub.tasks.length;
      const done = countChecked(sub, p);
      let statusLabel, statusBg, statusFg;
      if (total === 0){ statusLabel = 'Rien cette semaine'; statusBg = 'var(--surface-0)'; statusFg = 'var(--text-muted)'; }
      else if (p.validated){ statusLabel = 'Validée'; statusBg = 'var(--bg-success,#EAF3DE)'; statusFg = 'var(--text-success,#3B6D11)'; }
      else if (done > 0){ statusLabel = done+'/'+total; statusBg = '#FFF1C9'; statusFg = '#7A5600'; }
      else { statusLabel = 'À faire'; statusBg = 'var(--surface-0)'; statusFg = 'var(--text-secondary)'; }
      const pct = total === 0 ? 0 : Math.round((done/total)*100);
      out += '<div onclick="appAction(\'openSublieu\', {catId:\'night\', subId:\''+sub.id+'\'})" style="padding:14px 16px;border:2.5px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1);cursor:pointer;box-shadow:3px 3px 0 var(--border-strong,#000)">'+
        '<div style="display:flex;align-items:center;gap:12px">'+
          '<div style="width:36px;height:36px;border-radius:8px;border:2px solid var(--border-strong,#000);background:'+(p.validated ? '#3FAE6A' : 'var(--bg-accent,#FFD500)')+';color:'+(p.validated ? '#fff' : 'var(--text-primary)')+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(p.validated ? icon('check',18) : icon('clipboard',18))+'</div>'+
          '<div class="mama-title" style="flex:1;font-size:15px;color:var(--text-primary)">'+esc(sub.name)+'</div>'+
          '<span style="font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;background:'+statusBg+';color:'+statusFg+'">'+statusLabel+'</span>'+
          icon('chevronRight',18)+
        '</div>'+
        ((!p.validated && done > 0) ? '<div style="height:5px;border-radius:3px;background:var(--surface-0);margin-top:10px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:#2F3E7E"></div></div>' : '')+
      '</div>';
    });
    const es = state.nightEndShift;
    const esToday = es && es.dateKey === localDateKey(new Date());
    out += '<div onclick="appAction(\'goNightEndShift\')" style="padding:14px 16px;border:2.5px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1);cursor:pointer;box-shadow:3px 3px 0 var(--border-strong,#000)">'+

  function getRequisitionLocations(sub){
    const locations = [];
    sub.products.forEach(function(p){
      const loc = p.location || 'Autres';
      if (locations.indexOf(loc) === -1) locations.push(loc);
    });
    return locations;
  }
  function requiInputId(location, name){
    return 'requi-input-' + (location+'|'+name).replace(/[^a-zA-Z0-9]/g, '_');
  }
  function captureCurrentFridgeInputs(sub){
    const locations = getRequisitionLocations(sub);
    const idx = Math.max(0, Math.min(state.requisitionFridgeIndex||0, locations.length-1));
    const currentLocation = locations[idx];
    if (!currentLocation) return;
    const productsHere = sub.products.filter(function(p){ return (p.location||'Autres') === currentLocation; });
    state.requisitionDraft = state.requisitionDraft || {};
    productsHere.forEach(function(p){
      const el = document.getElementById(requiInputId(currentLocation, p.name));
      if (el){
        const key = currentLocation+'|'+p.name;
        if (el.value !== ''){ state.requisitionDraft[key] = el.value; }
        else { delete state.requisitionDraft[key]; }
      }
    });
  }

  // ===== Suivi d'une réqui : étape « Cave » (préparation) puis « Étage » (réception) =====
  // Un produit est « ok » à une étape s'il est coché et que la quantité saisie couvre la quantité demandée.
  function requiItemOk(p, stage){
    const m = p[stage];
    if (!m) return false;
    const q = parseFloat(String(m.qty == null ? '' : m.qty).replace(',', '.'));
    const asked = parseFloat(String(p.quantity == null ? '' : p.quantity).replace(',', '.'));
    if (isFinite(q) && isFinite(asked) && q < asked) return false;
    return true;
  }
  function requiStageCounts(r, stage){
    const prods = r.products || [];
    let done = 0;
    prods.forEach(function(p){ if (requiItemOk(p, stage)) done++; });
    return { done: done, total: prods.length, missing: prods.length - done };
  }
  function requiStageValidated(r, stage){ return !!(r.validation && r.validation[stage]); }
  function requiStageIncomplete(r, stage){ return requiStageValidated(r, stage) && requiStageCounts(r, stage).missing > 0; }
  function requiStatusLabel(r){
    const cave = requiStageValidated(r, 'cave'), etage = requiStageValidated(r, 'etage');
    if (cave && etage) return (requiStageIncomplete(r,'cave') || requiStageIncomplete(r,'etage')) ? { t:'Terminée · Incomplet', red:true } : { t:'Terminée', ok:true };
    if (cave) return { t: requiStageIncomplete(r,'cave') ? 'Cave validée · Incomplet' : 'Cave validée', red: requiStageIncomplete(r,'cave') };
    const c = requiStageCounts(r,'cave');
    if (c.done > 0 || requiStageCounts(r,'etage').done > 0) return { t:'En préparation' };
    return { t:'Nouvelle' };
  }
  function requiStatusBadge(r){
    const st = requiStatusLabel(r);
    const bg = st.red ? 'var(--text-danger,#A32D2D)' : (st.ok ? 'var(--text-success,#1F7A3D)' : 'var(--surface-0)');
    const fg = (st.red || st.ok) ? '#fff' : 'var(--text-primary)';
    return '<span style="display:inline-block;padding:2px 8px;border-radius:999px;border:1.5px solid var(--border-strong,#000);background:'+bg+';color:'+fg+';font-size:12px;font-weight:800;white-space:nowrap">'+esc(st.t)+'</span>';
  }
  function requiStageCard(r, stage, label, readonly){
    const cnt = requiStageCounts(r, stage);
    const val = r.validation && r.validation[stage];
    const incomplete = requiStageIncomplete(r, stage);
    let body = '';
    if (val){
      body += '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">Validée par '+esc(val.by||'')+(val.at?' · '+esc(val.at):'')+'</div>';
      if (incomplete){
        body += '<div style="margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--text-danger,#A32D2D);color:#fff;font-size:12px;font-weight:800">⚠ Incomplet — '+cnt.missing+' produit'+(cnt.missing>1?'s':'')+' non coché'+(cnt.missing>1?'s':'')+'</div>';
      } else {
        body += '<div style="margin-top:6px;font-size:12px;font-weight:800;color:var(--text-success,#1F7A3D)">✓ Complet</div>';
      }
    } else if (readonly){
      body += '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">Pas encore validée</div>';
    } else {
      body += '<button onclick="appAction(\'validateRequiStage\',{id:\''+r.id+'\',stage:\''+stage+'\'})" style="margin-top:8px;width:100%;padding:10px;border-radius:8px;border:2px solid var(--border-strong,#000);background:var(--text-accent,#185FA5);color:#fff;font-size:13px;font-weight:800;text-transform:uppercase;box-shadow:2px 2px 0 var(--border-strong,#000);cursor:pointer">Valider '+(stage==='cave'?'la cave':'le réassort')+'</button>';
    }
    return '<div style="flex:1;min-width:140px;padding:12px;border:2.5px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1)">'+
      '<div class="mama-title" style="font-size:13px;color:var(--text-primary)">'+esc(label)+' <span style="color:var(--text-muted);font-weight:600">'+cnt.done+'/'+cnt.total+'</span></div>'+body+'</div>';
  }
  function requiTrackingHtml(r, mode){
    const stageCards = '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">'+
      (mode === 'etage' ? requiStageCard(r,'cave','① Cave',true) : requiStageCard(r,'cave','① Cave'))+
      (mode === 'cave' ? '' : requiStageCard(r,'etage','② Réassort'))+'</div>';
    let out = '';
    out += '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">';
    let lastLoc = null;
    const cellBase = 'flex:1;min-width:0;border-radius:10px;border:2px solid var(--border-strong,#000);padding:6px;box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;gap:6px;color:#fff;';
    const stageCtl = function(p, i, stage, label){
      const m = p[stage];
      const ok = requiItemOk(p, stage);
      const bg = ok ? 'var(--text-success,#1F7A3D)' : 'var(--text-danger,#A32D2D)';
      const lab = (ok ? '✓ ' : '')+label;
      const qtyVal = m && m.qty != null ? String(m.qty) : '';
      const who = m ? (m.by||'') : '';
      const head = '<div style="font-size:12px;font-weight:800;text-align:center;line-height:1.2">'+esc(lab)+'</div>'+
        (who ? '<div style="font-size:12px;text-align:center;opacity:.9;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(who)+'</div>' : '');
      if (mode === 'etage' && stage === 'cave'){
        return '<div style="'+cellBase+'background:'+bg+'">'+head+
          '<div style="background:#fff;color:#1A1A1A;border-radius:6px;padding:7px 0;text-align:center;font-size:14px;font-weight:800">'+(m ? esc(qtyVal||p.quantity) : '—')+'</div></div>';
      }
      return '<div style="'+cellBase+'background:'+bg+'">'+
        '<div onclick="appAction(\'toggleRequiCheck\',{id:\''+r.id+'\',idx:'+i+',stage:\''+stage+'\'})" style="cursor:pointer">'+head+'</div>'+
        '<input type="text" inputmode="decimal" placeholder="Qté" value="'+esc(qtyVal)+'" onchange="appAction(\'setRequiQty\',{id:\''+r.id+'\',idx:'+i+',stage:\''+stage+'\',value:this.value})" style="width:100%;box-sizing:border-box;padding:7px 4px;border-radius:6px;border:none;background:#fff;color:#1A1A1A;font-size:14px;font-weight:800;text-align:center">'+
      '</div>';
    };
    const askedCell = function(p){
      return '<div style="'+cellBase+'background:var(--text-success,#1F7A3D)">'+
        '<div style="font-size:12px;font-weight:800;text-align:center;line-height:1.2">✓ Demandé</div>'+
        '<div style="background:#fff;color:#1A1A1A;border-radius:6px;padding:7px 0;text-align:center;font-size:14px;font-weight:800">'+esc(p.quantity)+'</div></div>';
    };
    (r.products||[]).forEach(function(p, i){
      if (p.location && p.location !== lastLoc){
        out += '<div class="mama-title" style="font-size:12px;color:var(--text-accent,#E8432B);margin-top:8px">'+esc(p.location)+'</div>';
        lastLoc = p.location;

  // ===== Archivage mensuel des rapports (compressé, exportable) =====
  function archiveTsOf(e){
    const m = e && typeof e.id === 'string' ? e.id.match(/-(\d{10,})/) : null;
    return m ? parseInt(m[1], 10) : null;
  }
  function archiveMonthOf(e){
    const ts = archiveTsOf(e);
    return ts ? monthKeyOf(new Date(ts)) : null;
  }
  function monthLabelOf(mk){
    const noms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    const parts = mk.split('-'); return noms[parseInt(parts[1],10)-1]+' '+parts[0];
  }
  function archiveCutoffMonth(){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - ARCHIVE_KEEP_MONTHS);
    return monthKeyOf(d); // les mois STRICTEMENT avant ce mois sont archivés
  }
  // Lecture stricte : une vraie erreur de lecture interrompt l'archivage (on ne supprime jamais sur une lecture douteuse).
  async function archiveReadList(key){
    try {
      const res = await window.storage.get(key, true);
      const list = JSON.parse(res.value);
      if (!Array.isArray(list)) throw new Error('format inattendu : '+key);
      return list;
    } catch(e){
      if (e && /not found/i.test(String(e.message||e))) return [];
      throw e;
    }
  }
  function bytesToB64(bytes){
    let bin = ''; const CH = 0x8000;
    for (let i=0; i<bytes.length; i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
    return btoa(bin);
  }
  function b64ToBytes(b64){
    const bin = atob(b64); const out = new Uint8Array(bin.length);
    for (let i=0; i<bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function archivePack(obj){
    const json = JSON.stringify(obj);
    if (typeof CompressionStream === 'undefined') return 'json:'+json;
    const cs = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    const buf = new Uint8Array(await new Response(cs).arrayBuffer());
    return 'gz:'+bytesToB64(buf);
  }
  async function archiveUnpack(str){
    if (str.indexOf('json:') === 0) return JSON.parse(str.slice(5));
    const bytes = b64ToBytes(str.slice(3));
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(ds).text());
  }
  async function archiveGetMonth(mk){
    try {
      const res = await window.storage.get('archive-'+mk, true);
      return { raw: res.value, data: await archiveUnpack(res.value) };
    } catch(e){
      if (e && /not found/i.test(String(e.message||e))) return null;
      throw e;
    }
  }
  async function archiveGetIndex(){
    try {
      const res = await window.storage.get('archiveIndex', true);
      const idx = JSON.parse(res.value);
      return Array.isArray(idx) ? idx : [];
    } catch(e){ return []; }
  }
  // Calcule ce qui doit être archivé (sans rien modifier).
  async function archivePlan(){
    const cutoff = archiveCutoffMonth();
    const lists = {};
    const plan = {}; let total = 0;
    for (const k of ARCHIVE_KINDS){
      lists[k.key] = await archiveReadList(k.key);
      lists[k.key].forEach(function(e){
        const mk = archiveMonthOf(e);
        if (!mk || mk >= cutoff) return;
        plan[mk] = plan[mk] || {};
        (plan[mk][k.key] = plan[mk][k.key] || []).push(e);
        total++;
      });
    }
    return { plan: plan, total: total, cutoff: cutoff };
  }
  let archiveRunning = false;
  async function runArchive(){
    if (archiveRunning) return { moved: 0, months: 0, skipped: true };
    archiveRunning = true;
    try {
      const pl = await archivePlan();
      const months = Object.keys(pl.plan).sort();
      if (!months.length) return { moved: 0, months: 0 };
      const verified = {}; // key -> Set d'ids archivés ET vérifiés
      const idx = await archiveGetIndex();
      for (const mk of months){
        const existing = await archiveGetMonth(mk);
        const data = existing && existing.data && existing.data.data ? existing.data.data : {};
        ARCHIVE_KINDS.forEach(function(k){
          const have = data[k.key] || [];
          const ids = {}; have.forEach(function(e){ if (e && e.id) ids[e.id] = true; });
          (pl.plan[mk][k.key] || []).forEach(function(e){ if (!ids[e.id]) have.push(e); });
          data[k.key] = have;
        });
        const packed = await archivePack({ month: mk, updatedAt: new Date().toISOString(), data: data });
        await window.storage.set('archive-'+mk, packed, true);
        // Vérification : on relit et on contrôle que chaque rapport est bien présent avant de supprimer quoi que ce soit.
        const back = await archiveGetMonth(mk);
        const check = (back && back.data && back.data.data) || {};
        let ok = true;
        ARCHIVE_KINDS.forEach(function(k){
          const got = {}; (check[k.key] || []).forEach(function(e){ if (e && e.id) got[e.id] = true; });
          (pl.plan[mk][k.key] || []).forEach(function(e){ if (!got[e.id]) ok = false; });
        });
        if (!ok) throw new Error('vérification archive '+mk+' échouée');
        ARCHIVE_KINDS.forEach(function(k){
          verified[k.key] = verified[k.key] || {};
          (pl.plan[mk][k.key] || []).forEach(function(e){ verified[k.key][e.id] = true; });
        });
        const counts = {}; let tot = 0;
        ARCHIVE_KINDS.forEach(function(k){ counts[k.key] = (data[k.key]||[]).length; tot += counts[k.key]; });
        const entry = { month: mk, counts: counts, total: tot, bytes: packed.length, updatedAt: new Date().toISOString() };
        const at = idx.findIndex(function(x){ return x.month === mk; });
        if (at >= 0) idx[at] = entry; else idx.push(entry);
      }
      // Retrait des listes actives : relecture fraîche, suppression par identifiant uniquement.
      let moved = 0;
      for (const k of ARCHIVE_KINDS){
        if (!verified[k.key]) continue;
        const fresh = await archiveReadList(k.key);
        const kept = fresh.filter(function(e){ return !(e && verified[k.key][e.id]); });
        moved += fresh.length - kept.length;
        if (kept.length !== fresh.length) await window.storage.set(k.key, JSON.stringify(kept), true);
      }
      idx.sort(function(a,b){ return a.month < b.month ? 1 : -1; });
      await window.storage.set('archiveIndex', JSON.stringify(idx), true);
      return { moved: moved, months: months.length };
    } finally {
      archiveRunning = false;
    }
  }
  // Lancé en tâche de fond à la connexion manager (au plus une fois par jour et par appareil).
  async function autoArchive(force){
    try {
      const today = dayKeyOf(new Date());
      if (!force){
        try { if (localStorage.getItem('archiveLastRun') === today) return; } catch(e){}
      }
      const r = await runArchive();
      if (!r.skipped){ try { localStorage.setItem('archiveLastRun', today); } catch(e){} }
      return r;
    } catch(e){
      console.error('Archivage mensuel non effectué :', e);
      return { error: true };
    }
  }

  function archiveCsvOf(mk, data){
    const q = function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };
    const flat = function(v){
      if (v == null) return '';
      if (Array.isArray(v)) return v.map(flat).join(' | ');
      if (typeof v === 'object') return Object.keys(v).map(function(k){ return k+': '+flat(v[k]); }).join(', ');
      return String(v);
    };
    let csv = 'Type;Zone;Sous-lieu;Opérateur;Date;Détail\n';
    ARCHIVE_KINDS.forEach(function(k){
      (data[k.key] || []).forEach(function(e){
        let detail = '';
        if (k.key === 'historique'){
          const snap = e.tasksSnapshot || [];
          const done = snap.filter(function(t){ return t.checked; }).length;
          const missing = snap.filter(function(t){ return !t.checked; }).map(function(t){ return t.label; });
          detail = done+'/'+snap.length+' tâches cochées'+(missing.length ? ' ; non cochées : '+missing.join(' | ') : '')+(e.comment ? ' ; commentaire : '+e.comment : '');
        } else if (k.key === 'temperatures'){
          detail = flat(e.readings)+(e.comment ? ' ; commentaire : '+e.comment : '');
        } else if (k.key === 'tracabilite'){
          detail = flat(e.entries);
        } else if (k.key === 'requisitions'){
          detail = (e.products||[]).map(function(pr){
            return pr.name+' ×'+pr.quantity+(pr.unit?' '+pr.unit:'')+' [cave: '+(pr.cave ? (pr.cave.qty!=null?pr.cave.qty:'ok') : '—')+' ; réassort: '+(pr.etage ? (pr.etage.qty!=null?pr.etage.qty:'ok') : '—')+']';
          }).join(' | ')+(e.comment ? ' ; commentaire : '+e.comment : '');
        } else {
          const c = Object.assign({}, e); delete c.id; delete c.operator; delete c.categoryName; delete c.sublieuName; delete c.when;
          detail = flat(c);
        }
        csv += [k.label, e.categoryName, e.sublieuName, e.operator, e.when, detail].map(q).join(';')+'\n';
      });
    });
    return csv;
  }

  window.pdjOnScroll = function(el){

    const c = document.getElementById('pdj-count'); if (c) c.textContent = (i+1)+' / '+n;
    const d = document.getElementById('pdj-dots');
    if (d) Array.prototype.forEach.call(d.children, function(sp, k){ sp.style.background = k===i ? 'var(--text-accent,#E8432B)' : 'var(--border)'; });

  window.pdjStep = function(dir){

  function renderWhatsupCalendar(daysBefore, daysAfter){
    const dayNames = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const days = [];
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayKeyStr = dayKeyOf(today);
    let start = new Date(today);
    let end = new Date(today.getFullYear(), 11, 31);
    if (daysBefore != null && daysAfter != null){
      start.setDate(start.getDate() - daysBefore);
      const limited = new Date(today);
      limited.setDate(limited.getDate() + daysAfter);
      if (limited < end) end = limited;
    }
    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
      days.push({ key: dayKeyOf(d), label: dayNames[d.getDay()]+' '+dayLabelOf(dayKeyOf(d)) });
    }
    // Carte d'un élément du fil d'actu : le titre coloré est placé sur le côté gauche (onglet vertical).
    const wuCard = function(label, color, textColor, bodyHtml){
      return '<div style="display:flex;align-items:stretch;border:2px solid var(--border-strong,var(--border));border-radius:10px;margin-bottom:10px;background:var(--surface-0);overflow:hidden">'+
        '<div style="flex:0 0 24px;background:'+color+';color:'+textColor+';display:flex;align-items:center;justify-content:center;border-right:2px solid var(--border-strong,var(--border))">'+
          '<span style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;padding:6px 0">'+esc(label)+'</span>'+
        '</div>'+
        '<div style="flex:1;min-width:0;padding:10px 12px">'+bodyHtml+'</div>'+
      '</div>';
    };
    let out = '<div style="padding:0 8px">'+
      '<div id="whatsup-scroll" style="display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:0">';
    days.forEach(function(day){
      const events = (state.events||[]).filter(function(e){ return e.date === day.key; });
      const sheets = (state.eventSheets||[]).filter(function(e){ return e.date === day.key; });
      const rhEvs = (state.rhEvents||[]).filter(function(e){ return e.date === day.key; });
      const isToday = day.key === todayKeyStr;
      out += '<div'+(isToday?' id="whatsup-today-card"':'')+' style="flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;padding:8px">'+
        '<div style="border:2.5px solid var(--border-strong,var(--border));border-radius:14px;background:var(--surface-1);box-shadow:4px 4px 0 var(--border-strong,#000);padding:18px;height:220px;overflow-y:auto">'+
          '<div class="mama-title" style="font-size:16px;color:var(--text-accent,#E8432B);text-align:center;margin-bottom:14px">'+esc(day.label)+'</div>';
      if (events.length === 0 && sheets.length === 0 && rhEvs.length === 0){
        out += '<div style="text-align:center;color:var(--text-muted);font-size:14px;padding:30px 10px">Rien de prévu ce jour-là.</div>';
      } else {
        rhEvs.forEach(function(rh){
          out += wuCard('P&C', '#3FAE6A', '#fff',
            '<div style="font-size:14px;font-weight:700;color:var(--text-primary)">'+esc(rh.type)+'</div>');
        });
        events.forEach(function(ev){
          out += wuCard('Entertainment', '#FF8AB4', '#1A1A1A',
            '<div style="font-size:14px;font-weight:700;color:var(--text-primary)">'+esc(ev.type)+'</div>'+
            (ev.place ? '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-top:4px">Lieu : '+esc(ev.place)+'</div>' : '')+
            (ev.info ? '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">'+esc(ev.info)+'</div>' : ''));
        });
        sheets.forEach(function(sh){
          const prestationsSummary = prestationLines(sh).map(function(l){ return esc(l); }).join('<br>');
          out += wuCard('Events', '#7A5FE0', '#fff',
            (sh.groupName ? '<div style="font-size:14px;font-weight:700;color:var(--text-primary)">'+esc(sh.groupName)+'</div>' : '')+
            (prestationsSummary ? '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px;line-height:1.5">'+prestationsSummary+'</div>' : '')+
            (sh.guests ? '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">'+esc(sh.guests)+' guests</div>' : '')+
            (sh.note ? '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">'+esc(sh.note)+'</div>' : ''));
        });
      }
      out += '</div></div>';
    });
    out += '</div></div>';
    out += '<p style="text-align:center;color:var(--text-muted);font-size:12px;margin:6px 0 4px">Fais glisser pour voir les jours suivants</p>';
    if (daysBefore != null && daysAfter != null){
      out += '<div onclick="appAction(\'goWhatsup\')" style="text-align:center;margin:4px 0 8px"><span style="font-size:13px;font-weight:700;color:var(--text-accent,#185FA5);text-decoration:underline;cursor:pointer">Voir tout le calendrier jusqu\'à fin d\'année</span></div>';
    }
    return out;
  }

  // ===== Vue du matin (managers) : ce qui s'est passé depuis hier midi =====
  function morningWindowStart(){
    const d = new Date(); d.setDate(d.getDate() - 1); d.setHours(12, 0, 0, 0); return d.getTime();
  }
  function histTs(h){ const m = /^hist-(\d{10,})/.exec(h.id || ''); return m ? +m[1] : 0; }
  function screenMorning(){
    const m = state.morning || { hist: [], loaded: false };
    const start = morningWindowStart();
    const recent = (m.hist || []).filter(function(h){ return histTs(h) >= start; });
    let out = requiHubHeader('Vue du matin', 'Éléments non cochés à la fermeture de la veille', "appAction('goManagerMenu')");
    out += '<div style="padding:8px 16px;display:flex;flex-direction:column;gap:12px">';
    if (!m.loaded){ out += '<div style="padding:30px;text-align:center;color:var(--text-muted)">Chargement…</div></div>'+bottomNav('menu'); return out; }
    const sec = function(t){ return '<div class="mama-title" style="font-size:13px;color:var(--text-secondary);margin:6px 2px 0;text-transform:uppercase;letter-spacing:.4px">'+t+'</div>'; };
    const card = function(ok, title, line, extra){
      const col = ok === 'ok' ? '#2D7A3E' : (ok === 'warn' ? '#B07A00' : '#A32D2D');
      return '<div style="padding:12px 14px;border-radius:12px;border:2.5px solid var(--border-strong,var(--border));border-left:8px solid '+col+';background:var(--surface-1)">'+
        '<div style="font-size:15px;font-weight:800;color:var(--text-primary)">'+(ok==='ok'?'✔ ':(ok==='warn'?'⚠ ':'✘ '))+esc(title)+'</div>'+
        '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">'+line+'</div>'+(extra||'')+'</div>';
    };
    const missingOf = function(h){ return (h.tasksSnapshot || []).filter(function(t){ return !t.checked; }); };
    const missingHtml = function(h){
      const miss = missingOf(h);
      let x = '';
      if (miss.length) x += '<ul style="margin:8px 0 0;padding-left:18px;font-size:13px;color:#A32D2D">'+miss.map(function(t){ return '<li>'+esc(t.label)+'</li>'; }).join('')+'</ul>';

      return x;
    };
    // 1) Fermetures
    const fermCat = (state.structure && state.structure.categories || []).find(function(c){ return c.id === 'fermeture'; });
    const floors = fermCat ? fermCat.sublieux : [];
    if (!floors.length) out += card('ko','Aucun floor configuré','');
    floors.forEach(function(f){
      const h = recent.find(function(x){ return x.categoryId === 'fermeture' && x.sublieuName === f.name; });
      if (!h) out += card('ko', f.name, 'Aucune fermeture enregistrée hier soir.');
      else {
        const n = missingOf(h).length;
        out += card(n ? 'warn' : 'ok', f.name, 'Fermé par <b>'+esc(h.operator || '?')+'</b> · '+esc(h.when || '')+(n ? ' · <b>'+n+' tâche'+(n>1?'s':'')+' non cochée'+(n>1?'s':'')+'</b>' : ' · tout est coché'), missingHtml(h));
      }
    });
    out += '</div>';
    out += bottomNav('menu');
    return out;
  }
