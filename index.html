            return '<div style="flex:1;min-width:140px;padding:10px;border:2px solid '+(inc?'var(--text-danger,#A32D2D)':'var(--border-strong,var(--border))')+';border-radius:10px;background:var(--surface-1);font-size:12px">'+
              '<div style="font-weight:800;color:var(--text-primary)">'+(st==='cave'?'Cave':'Réassort')+' · '+c.done+'/'+c.total+'</div>'+
              '<div style="color:'+(inc?'var(--text-danger,#A32D2D)':'var(--text-secondary)')+';margin-top:2px;font-weight:'+(inc?'800':'400')+'">'+(v ? (inc?'⚠ Incomplet · ':'✓ ')+esc(v.by||'')+(v.at?' · '+esc(v.at):'') : 'Non validée')+'</div></div>';
          }).join('')+'</div>';
        (rq.products||[]).forEach(function(pr){
          const missH = (requiStageValidated(rq,'cave') && !requiItemOk(pr,'cave')) || (requiStageValidated(rq,'etage') && !requiItemOk(pr,'etage'));
          out += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:2px solid '+(missH?'var(--text-danger,#A32D2D)':'var(--border-strong,var(--border))')+';border-radius:10px;background:'+(missH?'rgba(163,45,45,.10)':'var(--surface-1)')+'">'+
            '<div style="min-width:0"><div style="font-size:14px;font-weight:600;color:var(--text-primary)">'+esc(pr.name)+'</div>'+
            (pr.location ? '<div style="font-size:12px;color:var(--text-muted);margin-top:2px">'+esc(pr.location)+'</div>' : '')+
            '<div style="font-size:12px;margin-top:2px;color:'+(missH?'var(--text-danger,#A32D2D)':'var(--text-muted)')+'">Demandé ✓ · Cave '+(pr.cave?(requiItemOk(pr,'cave')?'✓ ':'⚠ ')+esc(pr.cave.qty!=null?pr.cave.qty:''):'—')+' · Réassort '+(pr.etage?(requiItemOk(pr,'etage')?'✓ ':'⚠ ')+esc(pr.etage.qty!=null?pr.etage.qty:''):'—')+'</div></div>'+
            '<div style="font-size:14px;font-weight:700;color:var(--text-accent,#E8432B);white-space:nowrap">'+esc(pr.quantity)+(pr.unit ? ' '+esc(pr.unit) : '')+'</div>'+
          '</div>';
        });
        if (!rq.products || rq.products.length === 0){
          out += '<div style="padding:16px;color:var(--text-muted);font-size:14px;text-align:center">Aucun produit demandé dans cette réquisition.</div>';
        }
        out += '</div>';
        out += '</div>';
        return out;
      }
    }

    // Niveau 3ter : détail d'un relevé de traçabilité précis
    if (state.historiqueTracaId){
      const tr = (state.tracabilite||[]).find(function(x){ return x.id === state.historiqueTracaId; });
      if (!tr){ state.historiqueTracaId = null; }
      else {
        let out = '<div style="padding:8px 16px">';
        out += '<div onclick="appAction(\'backHistoriqueTraca\')" style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;margin-bottom:12px;font-size:14px">'+icon('back',18)+'<span>Retour</span></div>';
        out += '<div style="border:2.5px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1);box-shadow:3px 3px 0 var(--border-strong,#000);padding:16px">';
        out += '<div class="mama-title" style="font-size:16px;color:var(--text-primary)">'+esc(tr.sublieuName)+'</div>';
        out += '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">'+esc(tr.categoryName)+' · Par '+esc(tr.operator)+' · '+esc(tr.when)+'</div>';
        out += '</div>';

        out += '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">';
        (tr.entries||[]).forEach(function(e){
          out += '<div style="padding:12px 14px;border:2px solid var(--border-strong,var(--border));border-radius:10px;background:var(--surface-1)">'+
            '<div style="font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:4px">'+esc(e.name)+'</div>';
          if (e.isBeurre){
            out += '<div style="font-size:13px;color:var(--text-secondary)">Fabrication : '+(e.fabrication?esc(e.fabrication):'—')+' · DDM : '+(e.ddm?esc(e.ddm):'—')+'</div>';
          } else {
            out += '<div style="font-size:13px;color:var(--text-secondary)">DLC : '+(e.dlc?esc(e.dlc):'—')+' · N° de lot : '+(e.lot?esc(e.lot):'—')+'</div>';
          }
          out += '</div>';
        });
        out += '</div>';
        out += '</div>';
        return out;
      }
    }

    // Niveau 3bis : détail d'un relevé de température précis
    if (state.historiqueTempId){
      const t = (state.temperatures||[]).find(function(x){ return x.id === state.historiqueTempId; });
      if (!t){ state.historiqueTempId = null; }
      else {
        let out = '<div style="padding:8px 16px">';
        out += '<div onclick="appAction(\'backHistoriqueTemp\')" style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;margin-bottom:12px;font-size:14px">'+icon('back',18)+'<span>Retour</span></div>';
        out += '<div style="border:2.5px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1);box-shadow:3px 3px 0 var(--border-strong,#000);padding:16px">';
        out += '<div class="mama-title" style="font-size:16px;color:var(--text-primary)">'+esc(t.sublieuName)+'</div>';
        out += '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">'+esc(t.categoryName)+' · Par '+esc(t.operator)+' · '+esc(t.when)+'</div>';
        if (t.checklistConfirmed && t.checklistConfirmed.length > 0){
          out += '<div style="margin-top:10px;display:flex;flex-direction:column;gap:4px">';
          t.checklistConfirmed.forEach(function(label){
            out += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-success,#3B6D11)">'+icon('check',14)+'<span>'+esc(label)+'</span></div>';
          });
          out += '</div>';
        }
        if (t.comment){
          out += '<div style="font-size:13px;color:var(--text-primary);margin-top:12px;padding:10px;border-radius:8px;background:var(--surface-0)">'+esc(t.comment)+'</div>';
        }
        out += '</div>';

        out += '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">';
        (t.readings||[]).forEach(function(r){
          out += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:2px solid var(--border-strong,var(--border));border-radius:10px;background:var(--surface-1)">'+
            '<div style="font-size:14px;font-weight:600;color:var(--text-primary)">'+esc(r.fridge)+'</div>'+
            '<div style="font-size:14px;font-weight:700;color:var(--text-accent,#E8432B)">'+(r.value!==null && r.value!=='' ? esc(r.value)+' °C' : '—')+'</div>'+
          '</div>';
        });
        out += '</div>';
        out += '</div>';
        return out;
      }
    }

    // Niveau 3 : détail d'un rapport précis
    if (state.historiqueReportId){
      const h = state.historique.find(function(x){ return x.id === state.historiqueReportId; });
      if (!h){ state.historiqueReportId = null; }
      else {
        let out = '<div style="padding:8px 16px">';
        out += '<div onclick="appAction(\'backHistoriqueReports\')" style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;margin-bottom:12px;font-size:14px">'+icon('back',18)+'<span>Retour</span></div>';
        out += '<div style="border:2.5px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1);box-shadow:3px 3px 0 var(--border-strong,#000);padding:16px">';
        out += '<div class="mama-title" style="font-size:16px;color:var(--text-primary)">'+esc(h.sublieuName)+'</div>';
        out += '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">'+esc(h.categoryName)+' · Par '+esc(h.operator)+' · '+esc(h.when)+'</div>';
        if (h.weekLabel){
          out += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">Semaine '+esc(h.weekLabel)+'</div>';
        }
        if (h.comment){
          out += '<div style="font-size:13px;color:var(--text-primary);margin-top:12px;padding:10px;border-radius:8px;background:var(--surface-0)">'+esc(h.comment)+'</div>';
        }
        out += '</div>';

        out += '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">';
        (h.tasksSnapshot||[]).forEach(function(t){
          out += '<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--border-strong,var(--border));border-radius:10px;background:'+(t.checked?'var(--bg-accent,#FFD500)':'var(--surface-1)')+'">'+
            '<div style="flex-shrink:0;width:18px;color:var(--text-primary)">'+(t.checked?icon('check',18):'')+'</div>'+
            '<div style="flex:1;font-size:14px;font-weight:600;color:var(--text-primary)">'+esc(t.label)+'</div>'+
          '</div>';
        });
        if (!h.tasksSnapshot || h.tasksSnapshot.length === 0){
          out += '<div style="padding:16px;color:var(--text-muted);font-size:14px;text-align:center">Pas de détail de tâches disponible pour ce rapport.</div>';
        }
        out += '</div>';
        out += '</div>';
        return out;
      }
    }

    // Niveau 2 : liste des rapports d'une zone (checklists + relevés fusionnés)
    if (state.historiqueZone){
      const reports = state.historique.filter(function(h){ return h.categoryName === state.historiqueZone; }).map(function(h){ return { kind:'checklist', data:h }; });
      const tempReadings = (state.temperatures||[]).filter(function(t){ return t.categoryName === state.historiqueZone; }).map(function(t){ return { kind:'temperature', data:t }; });
      const tracaReadings = (state.tracabilite||[]).filter(function(t){ return t.categoryName === state.historiqueZone; }).map(function(t){ return { kind:'tracabilite', data:t }; });
      const reqReadings = []; // les réquis ne sont plus dans l'historique : voir « Suivre une réqui »
      let all = reports.concat(tempReadings).concat(tracaReadings).concat(reqReadings);
      const tsOf = function(item){ const m = /-(\d{10,})/.exec(item.data.id || ''); return m ? +m[1] : 0; };
      all = all.map(function(item, i){ return { item:item, i:i }; }).sort(function(a, b){ return (tsOf(b.item) - tsOf(a.item)) || (a.i - b.i); }).map(function(x){ return x.item; });
      const typeFilter = state.historiqueTypeFilter || 'tous';
      if (typeFilter === 'temperature'){
        all = all.filter(function(item){ return item.kind === 'temperature'; });
      } else if (typeFilter === 'tracabilite'){
        all = all.filter(function(item){ return item.kind === 'tracabilite'; });
      } else if (typeFilter === 'requisition'){
        all = all.filter(function(item){ return item.kind === 'requisition'; });
      } else if (typeFilter === 'nettoyage'){
        all = all.filter(function(item){ return item.kind === 'checklist' && /nettoyage/i.test(item.data.sublieuName); });
      } else if (typeFilter === 'checklists'){
        all = all.filter(function(item){ return item.kind === 'checklist' && !/nettoyage/i.test(item.data.sublieuName); });
      }
      let out = '<div style="padding:8px 16px;display:flex;flex-direction:column;gap:10px">';
      out += '<div onclick="appAction(\'backHistoriqueZones\')" style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;margin-bottom:4px;font-size:14px">'+icon('back',18)+'<span>Retour aux zones</span></div>';
      out += '<div class="mama-title" style="font-size:14px;color:var(--text-secondary);margin-bottom:2px">Rapports</div>';
      const filterOptions = [
        {id:'tous', label:'Tous'},
        {id:'checklists', label:'Checklists'},
        {id:'nettoyage', label:'Nettoyage'},
        {id:'temperature', label:'Température'},
        {id:'tracabilite', label:'Traçabilité'}
      ];
      out += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">';
      filterOptions.forEach(function(f){
        const active = typeFilter === f.id;
        out += '<button onclick="appAction(\'setHistoriqueTypeFilter\',\''+f.id+'\')" style="padding:7px 12px;border-radius:999px;border:1.5px solid '+(active?'var(--text-accent,#185FA5)':'var(--border)')+';background:'+(active?'var(--text-accent,#185FA5)':'var(--surface-1)')+';color:'+(active?'#fff':'var(--text-secondary)')+';font-size:12px;font-weight:700;cursor:pointer">'+f.label+'</button>';
      });
      out += '</div>';
      if (all.length === 0){
        out += '<div style="padding:16px;color:var(--text-muted);font-size:14px;text-align:center">Aucun rapport pour ce filtre.</div>';
      }
      all.forEach(function(item){
        const r = item.data;
        const action = item.kind === 'temperature' ? 'openHistoriqueTemp' : (item.kind === 'tracabilite' ? 'openHistoriqueTraca' : (item.kind === 'requisition' ? 'openHistoriqueReq' : 'openHistoriqueReport'));
        out += '<div onclick="appAction(\''+action+'\',\''+r.id+'\')" style="padding:14px 16px;border:2.5px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1);box-shadow:3px 3px 0 var(--border-strong,#000);cursor:pointer;display:flex;align-items:center;justify-content:space-between">'+
          '<div><div style="font-size:15px;font-weight:600;color:var(--text-primary)">'+esc(r.sublieuName)+'</div>'+
          '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">Par '+esc(r.operator)+' · '+esc(r.when)+'</div>'+
          (r.weekLabel ? '<div style="font-size:12px;color:var(--text-muted);margin-top:2px">Semaine '+esc(r.weekLabel)+'</div>' : '')+'</div>'+
          icon('chevronRight',18)+
        '</div>';
      });
      out += '</div>';
      return out;
    }

    // Niveau 1 : liste des zones
    const catNames = state.structure.categories.map(function(c){ return c.name; });
    const orderedNames = [];
    if (catNames.includes('Fermeture')) orderedNames.push('Fermeture');
    catNames.forEach(function(n){ if (n !== 'Fermeture' && orderedNames.indexOf(n) === -1) orderedNames.push(n); });
    const zoneNames = Array.from(new Set(orderedNames));
    let out = '<div style="padding:8px 16px;display:flex;flex-direction:column;gap:10px">';
    if (state.historique.length === 0){
      out += '<div style="padding:16px;color:var(--text-muted);font-size:14px;text-align:center">Aucune checklist validée pour l\'instant.</div>';
    }
    zoneNames.forEach(function(zoneName){
      const count = state.historique.filter(function(h){ return h.categoryName === zoneName; }).length
        + (state.temperatures||[]).filter(function(t){ return t.categoryName === zoneName; }).length
        + (state.tracabilite||[]).filter(function(t){ return t.categoryName === zoneName; }).length;
      out += '<div onclick="appAction(\'openHistoriqueZone\',\''+escJs(zoneName)+'\')" style="padding:16px;border:2.5px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1);box-shadow:3px 3px 0 var(--border-strong,#000);cursor:pointer;display:flex;align-items:center;justify-content:space-between">'+
        '<div class="mama-title" style="font-size:15px;color:var(--text-primary)">'+esc(zoneName)+'</div>'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<span style="font-size:13px;color:var(--text-secondary)">'+count+' rapport'+(count>1?'s':'')+'</span>'+
          icon('chevronRight',18)+
        '</div>'+
      '</div>';
    });
    out += '</div>';
    return out;
  }

  function screenPertesEconome(){
    return economeHeader() + renderPertesHistorique();
  }

  function renderPertesHistorique(){
    const months = Array.from(new Set((state.pertes||[]).map(function(p){ return p.monthKey; })));
    if (!months.includes(state.historiqueMonth)) months.unshift(state.historiqueMonth);
    months.sort().reverse();
    const rows = (state.pertes||[]).filter(function(p){ return p.monthKey === state.historiqueMonth; });

    let out = '<div style="padding:8px 16px">';
    out += '<div onclick="appAction(\''+(state.screen==='pertes-econome'?'backPertesEconome':'backHistoriqueZones')+'\')" style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;margin-bottom:12px;font-size:14px">'+icon('back',18)+'<span>Retour aux zones</span></div>';
    out += '</div>';

    out += '<div style="padding:8px 16px" class="no-print">';
    out += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">'+
      '<select id="historique-month-select" onchange="appAction(\'setHistoriqueMonth\')" style="flex:1;min-width:140px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);font-size:14px">'+
      months.map(function(m){ return '<option value="'+m+'" '+(m===state.historiqueMonth?'selected':'')+'>'+monthLabelOf(m)+'</option>'; }).join('')+
      '</select>'+
      '<button onclick="appAction(\'downloadPertesCSV\')" style="padding:10px 14px;border-radius:8px;border:2px solid var(--border-strong,#000);background:var(--text-accent,#185FA5);color:#fff;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;box-shadow:2px 2px 0 var(--border-strong,#000);cursor:pointer;white-space:nowrap">Télécharger (CSV)</button>'+
      '<button onclick="appAction(\'copyPertesCSV\')" style="padding:10px 14px;border-radius:8px;border:none;background:none;color:var(--text-muted);font-size:13px;cursor:pointer;white-space:nowrap">Copier</button>'+
    '</div>';
    if (state.copyFeedback === true){
      out += '<p style="color:var(--text-success,#3B6D11);font-size:13px;margin:0 0 10px">Tableau copié — colle-le dans Excel ou un email.</p>';
    } else if (state.copyFeedback === 'error'){
      out += '<p style="color:var(--text-danger,#A32D2D);font-size:13px;margin:0 0 10px">La copie automatique n\'a pas fonctionné, copie manuellement les lignes ci-dessous.</p>';
    }
    out += '<p style="font-size:12px;color:var(--text-muted);margin:0 0 12px">Le fichier CSV s\'ouvre dans Excel et se joint directement à un e-mail pour la comptabilité.</p>';
    out += '</div>';

    out += '<div id="pertes-print-area" style="padding:8px 16px">';
    if (rows.length === 0){
      out += '<div style="padding:16px;color:var(--text-muted);font-size:14px;text-align:center">Aucune perte déclarée pour ce mois.</div>';
    } else {
      out += '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:10px">'+
        '<table style="width:100%;border-collapse:collapse;font-size:13px">'+
        '<thead><tr style="background:var(--surface-0);text-align:left">'+
          '<th style="padding:8px">Date</th><th style="padding:8px">Produit</th><th style="padding:8px">Qté</th><th style="padding:8px">Raison</th><th style="padding:8px">Opérateur</th>'+
        '</tr></thead><tbody>';
      rows.forEach(function(p){
        out += '<tr style="border-top:1px solid var(--border)">'+
          '<td style="padding:8px">'+esc(p.when)+'</td>'+
          '<td style="padding:8px">'+esc(p.product)+'</td>'+
          '<td style="padding:8px">'+esc(p.quantity)+'</td>'+
          '<td style="padding:8px">'+esc(p.reason)+'</td>'+
          '<td style="padding:8px">'+esc(p.operator)+'</td>'+
        '</tr>';
      });
      out += '</tbody></table></div>';
    }
    out += '</div>';
    return out;
  }

  function screenHistorique(){
    let out = '<div style="padding:20px 16px 8px">'+
      '<div style="padding:14px 16px;border-radius:14px;border:2.5px solid var(--border-strong,var(--border));background:var(--surface-1);box-shadow:4px 4px 0 var(--border-strong,#000);display:flex;align-items:center;gap:12px">'+
        '<div onclick="appAction(\'goChecklistesMenu\')" style="cursor:pointer;color:var(--text-secondary)">'+icon('back',22)+'</div>'+
        '<h1 class="mama-title" style="font-size:20px;font-weight:800;margin:0;color:var(--text-primary);flex:1">Historique des checklistes</h1>'+
      '</div>'+
    '</div>';

    if (state.historiqueZone === 'Pertes'){
      out += renderPertesHistorique();
    } else {
      out += screenHistoriqueChecklists();
    }

    out += bottomNav('menu');
    return out;
  }

  function screenRecettesReadView(){
    const list = state.barRecettes || [];
    const viewing = state.recetteViewingId ? list.find(function(p){ return p.id === state.recetteViewingId; }) : null;

    if (viewing){
      let out = '<div style="padding:20px 16px 8px">'+
        '<div style="padding:14px 16px;border-radius:14px;border:2.5px solid var(--border-strong,var(--border));background:var(--surface-1);box-shadow:4px 4px 0 var(--border-strong,#000);display:flex;align-items:center;gap:12px">'+
          '<div onclick="appAction(\'backToRecettesReadList\')" style="cursor:pointer;color:var(--text-secondary)">'+icon('back',22)+'</div>'+
          '<h1 class="mama-title" style="font-size:17px;color:var(--text-primary);margin:0;flex:1">'+esc(viewing.title)+'</h1>'+
        '</div>'+
      '</div>';
      out += '<div style="padding:8px 16px">';
      out += '<div style="padding:16px;border:2px solid var(--border-strong,var(--border));border-radius:12px;background:var(--surface-1);font-size:14px;color:var(--text-primary);white-space:pre-wrap;line-height:1.5">'+
        (viewing.content ? esc(viewing.content) : '<span style="color:var(--text-muted)">Contenu pas encore rempli.</span>')+
      '</div>';
      out += '</div>';
      out += bottomNav('home');
      return out;
    }

    let out = '<div style="padding:20px 16px 8px">'+
      '<div style="padding:14px 16px;border-radius:14px;border:2.5px solid var(--border-strong,var(--border));background:var(--surface-1);box-shadow:4px 4px 0 var(--border-strong,#000);display:flex;align-items:center;gap:12px">'+
        '<div onclick="appAction(\'goHome\')" style="cursor:pointer;color:var(--text-secondary)">'+icon('back',22)+'</div>'+
        '<h1 class="mama-title" style="font-size:17px;color:var(--text-primary);margin:0;flex:1">Recettes et infos</h1>'+
      '</div>'+
    '</div>';
    out += '<div style="padding:8px 16px;display:flex;flex-direction:column;gap:10px">';
    if (list.length === 0){
      out += '<div style="padding:16px;color:var(--text-muted);font-size:14px;text-align:center">Aucune fiche pour l\'instant.</div>';

    const db = await agLoad();

    agDb = db;

  function agVisible(r){
    if (!r || r.validation !== 'validated' || r.pub !== 'published') return false;

      const m = agMenu(p.m); const f = m && m.families.find(function(x){ return x.id === p.f; });
      return (m && f) ? { menu:m, fam:f } : null;
    }).filter(Boolean);

  function agNorm(s){
    return String(s||'').toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  }
  function agLev(a, b){
    if (a === b) return 0;
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = []; for (let j=0;j<=n;j++) prev[j] = j;
    for (let i=1;i<=m;i++){
      const cur = [i];
      for (let j=1;j<=n;j++){
        cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }
  function agScore(q, r){
    const terms = agNorm(q).split(' ').filter(Boolean);
    if (!terms.length) return 0;
    const names = [r.nameFr, r.nameEn].map(agNorm).filter(Boolean);
    const words = names.join(' ').split(' ').filter(Boolean);
    let total = 0;
    for (let i=0;i<terms.length;i++){
      const t = terms[i];
      let s = 0;
      if (words.some(function(w){ return w.indexOf(t) === 0; })) s = 4;
      else if (names.some(function(n){ return n.indexOf(t) >= 0; })) s = 3;
      else if (t.length >= 4){
        const tol = t.length >= 7 ? 2 : 1;
        const ok = words.some(function(w){ return agLev(t, w) <= tol || (w.length > t.length && agLev(t, w.slice(0, t.length)) <= tol); });
        if (ok) s = 1;
      }
      if (!s) return 0;
      total += s;
    }
    return total;

  function agRerender(keepFocus){

  // Rafraîchit les données depuis la base (un plat masqué par un manager disparaît vite côté Guest).
  let agLastJson = '';
  async function agRefresh(){
    if (!document.getElementById('ag-root') || !agDb) return;
    try {
      const fresh = await agLoad();
      const j = JSON.stringify(fresh);
      if (j === agLastJson) return;
      agLastJson = j; agDb = fresh;

  }

  window.agAct = function(type, val){

    else if (type === 'menu'){ agUI.menuId = val; agUI.famId = null; }

  // ================= IMPORT EXCEL =================
  const AG_IMP_COLS = [ ['arachid','Arachides'],['celeri','Céleri'],['gluten','Gluten'],['cereale','Gluten'],['crustac','Crustacés'],['fruits a coque','Fruits à coque'],['lait','Lait'],['lupin','Lupin'],['mollusq','Mollusques'],['moutarde','Moutarde'],['oeuf','Œufs'],['poisson','Poissons'],['sesame','Sésame'],['soja','Soja'],['sulfite','Sulfites'] ];
  const AG_IMP_SKIP_SECTION = /^(boissons?|animation|apero|aperitif|accueil)\b/;
  const AG_IMP_STOP = ['de','la','le','du','des','l','ou','a','et','au','aux'];
  function agImpLoose(s){ return agNorm(s).split(' ').filter(function(w){ return w && AG_IMP_STOP.indexOf(w) < 0; }).join(' '); }
  function agImpSlug(s){ return agNorm(s).replace(/ /g,'-').slice(0,30) || 'x'; }
  function agImpTitle(s){ const t = String(s||'').trim().toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); }
  function agImpSplitLabel(label){
    const i = label.indexOf(' — ');
    return i > 0 ? { nameFr: label.slice(0,i).trim(), descFr: label.slice(i+3).trim() } : { nameFr: label.trim(), descFr: '' };
  }
  function agImpIsSection(label){ return label.toUpperCase() === label && /[A-ZÀ-Ý]/.test(label); }
  function agImpSig(allergens){ return (allergens||[]).slice().sort().join('|'); }

  // rows : tableau de lignes (tableaux de cellules) d'un onglet. Retourne { title, menuHint, items, skipped, error }
  function agImpParseSheet(title, rows){
    const res = { title:title, menuHint:'', items:[], skipped:[], error:'' };
    const a1 = String((rows[0] && rows[0][0]) || '').trim();
    res.menuHint = a1.split(' — ')[0].trim();
    let headerIdx = -1, colMap = {};
    for (let i=0;i<Math.min(rows.length,12);i++){
      const r = rows[i] || [];
      if (!/^plats/.test(agNorm(r[0]))) continue;
      const map = {};
      for (let j=1;j<r.length;j++){
        const h = agNorm(r[j]);
        for (let k=0;k<AG_IMP_COLS.length;k++){ if (h && h.indexOf(AG_IMP_COLS[k][0]) >= 0){ map[j] = AG_IMP_COLS[k][1]; break; } }
      }
      if (new Set(Object.keys(map).map(function(j){ return map[j]; })).size >= 14){ headerIdx = i; colMap = map; break; }
    }
    if (headerIdx < 0){ res.error = 'Colonnes d\'allergènes introuvables (14 attendues).'; return res; }
    let section = '', skipping = false; const skipCount = {};
    for (let i=headerIdx+1;i<rows.length;i++){
      const r = rows[i] || [];
      const label = String(r[0] == null ? '' : r[0]).trim();
      if (!label) continue;
      const n = agNorm(label);
      if (/^(cases allergenes|a completer)/.test(n) || /^[¹²³]/.test(label)) continue;
      const marks = [];
      Object.keys(colMap).forEach(function(j){
        const c = r[j]; if (c != null && String(c).trim() !== '' && marks.indexOf(colMap[j]) < 0) marks.push(colMap[j]);
      });
      if (!marks.length && agImpIsSection(label)){
        section = agImpTitle(label.split(' — ')[0]);
        skipping = AG_IMP_SKIP_SECTION.test(agNorm(section));
        if (skipping) skipCount[section] = 0;
        continue;
      }
      if (skipping){ skipCount[section]++; continue; }
      res.items.push({ sheet:title, section:section, label:label, allergens:marks });
    }
    Object.keys(skipCount).forEach(function(s){ res.skipped.push({ sheet:title, section:s, count:skipCount[s] }); });
    return res;
  }

  function agImpFindMenu(db, hint, title){
    const hs = [agImpLoose(hint), agImpLoose(title)].filter(Boolean);
    return db.menus.find(function(m){ return hs.indexOf(agImpLoose(m.nameFr)) >= 0 || (m.nameEn && hs.indexOf(agImpLoose(m.nameEn)) >= 0); }) || null;
  }

  function agImpPlan(db, sheets, opts){
    const plan = { opts:opts, newFamilies:[], recipes:[], unknown:[], skipped:[], sheetErrors:[], divergences:[], dupNames:[], sheetSummary:[],
      sum:{ rows:0, newRec:0, newValidated:0, newTodo:0, same:0, keep:0, conflicts:0, newPlaces:0, newFams:0, skippedRows:0 } };
    const entries = [];
    sheets.forEach(function(sh){
      if (sh.error){ plan.sheetErrors.push(sh.title+' : '+sh.error); return; }
      sh.skipped.forEach(function(s){ plan.skipped.push(s); plan.sum.skippedRows += s.count; });
      const menu = agImpFindMenu(db, sh.menuHint, sh.title);
      if (!menu){ plan.unknown.push({ sheet:sh.title, hint:sh.menuHint, rows:sh.items.length }); return; }
      plan.sheetSummary.push({ sheet:sh.title, menu:menu.nameFr, rows:sh.items.length });
      sh.items.forEach(function(it){
        const famName = (menu.type === 'carte') ? sh.title : (it.section || 'Divers');
        let fam = menu.families.find(function(f){ return agImpLoose(f.nameFr) === agImpLoose(famName); });
        if (!fam) fam = plan.newFamilies.find(function(f){ return f.menuId === menu.id && agImpLoose(f.nameFr) === agImpLoose(famName); });
        if (!fam){
          let id = menu.id+'-'+agImpSlug(famName), k = 2;
          while (menu.families.some(function(f){ return f.id === id; }) || plan.newFamilies.some(function(f){ return f.id === id && f.menuId === menu.id; })) id = menu.id+'-'+agImpSlug(famName)+(k++);
          fam = { menuId:menu.id, id:id, nameFr:famName };
          plan.newFamilies.push(fam);
        }
        entries.push({ menu:menu, fam:fam, it:it });
        plan.sum.rows++;
      });
    });
    // regroupe par libellé complet puis par signature d'allergènes
    const byKey = {};
    entries.forEach(function(e){
      const key = agNorm(e.it.label);
      (byKey[key] = byKey[key] || []).push(e);
    });
    const cands = [];
    Object.keys(byKey).forEach(function(key){
      const bySig = {};
      byKey[key].forEach(function(e){ const s = agImpSig(e.it.allergens); (bySig[s] = bySig[s] || []).push(e); });
      const sigs = Object.keys(bySig);
      if (sigs.length > 1){
        plan.divergences.push({ label:byKey[key][0].it.label, variants: sigs.map(function(s){ return { allergens: s ? s.split('|') : [], where: bySig[s].map(function(e){ return e.menu.nameFr+' · '+e.fam.nameFr; }) }; }) });
      }
      sigs.forEach(function(s){
        const es = bySig[s]; const sp = agImpSplitLabel(es[0].it.label);
        const places = [];
        es.forEach(function(e){ if (!places.some(function(p){ return p.m === e.menu.id && p.f === e.fam.id; })) places.push({ m:e.menu.id, f:e.fam.id }); });
        cands.push({ key:key, sig:s, nameFr:sp.nameFr, descFr:sp.descFr, label:es[0].it.label, allergens:es[0].it.allergens.slice(), places:places, multi:sigs.length > 1, conflictId:'' });
      });
    });
    // rapproche des recettes existantes
    cands.forEach(function(c, idx){
      const matches = db.recipes.filter(function(r){ return agNorm(r.nameFr+' '+(r.descFr||'')) === c.key || (r.aliasKeys||[]).indexOf(c.key) >= 0; });
      const sameSig = matches.find(function(r){ return agImpSig(Object.keys(r.allergens||{})) === c.sig && (!!r.noAllergen === false); });
      const ex = sameSig || matches[0] || null;
      if (!ex){ c.action = 'new'; }
      else if (sameSig || (!c.allergens.length && !ex.noAllergen && !Object.keys(ex.allergens||{}).length)){ c.action = 'same'; c.existingId = ex.id; }
      else if (!c.allergens.length){ c.action = 'keep'; c.existingId = ex.id; }
      else { c.action = 'conflict'; c.existingId = ex.id; c.existingAl = Object.keys(ex.allergens||{}); }
      c.idx = idx;
      // lieux réellement nouveaux
      c.newPlaces = c.places.filter(function(p){ return !ex || !(ex.places||[]).some(function(q){ return q.m === p.m && q.f === p.f; }); });
      if (c.action === 'new'){ plan.sum.newRec++; if (c.allergens.length) plan.sum.newValidated++; else plan.sum.newTodo++; }
      else if (c.action === 'same') plan.sum.same++;
      else if (c.action === 'keep') plan.sum.keep++;
      else plan.sum.conflicts++;
      plan.sum.newPlaces += c.newPlaces.length;
    });
    // doublons probables : même nom, descriptions différentes
    const byName = {};
    cands.filter(function(c){ return c.action === 'new'; }).forEach(function(c){ (byName[agNorm(c.nameFr)] = byName[agNorm(c.nameFr)] || []).push(c); });
    Object.keys(byName).forEach(function(k){
      const list = byName[k]; if (list.length < 2) return;
      if (list.every(function(c){ return c.key === list[0].key; })) return;
      plan.dupNames.push({ name:list[0].nameFr, variants:list.map(function(c){ return c.descFr || '(sans description)'; }) });
    });
    plan.sum.newFams = plan.newFamilies.length;
    plan.recipes = cands;
    return plan;
  }

  // Applique le plan sur db (mutation). replace = { [idx]: true } pour les conflits à remplacer. Retourne les lignes d'historique.
  function agImpApply(db, plan, replace, user, idPrefix){
    const logs = []; const now = (typeof nowLabel === 'function') ? nowLabel() : '';
    plan.newFamilies.forEach(function(nf){
      const m = db.menus.find(function(x){ return x.id === nf.menuId; });
      if (m && !m.families.some(function(f){ return f.id === nf.id; })) m.families.push({ id:nf.id, nameFr:nf.nameFr, nameEn:'' });
    });
    const toAl = function(list){ const o = {}; list.forEach(function(a){ o[a] = 'precaution'; }); return o; };
    plan.recipes.forEach(function(c, i){
      let r = c.existingId ? db.recipes.find(function(x){ return x.id === c.existingId; }) : null;
      if (c.action === 'new'){
        const ok = plan.opts.markValidated && c.allergens.length > 0;
        r = { id:'r-'+(idPrefix || Date.now().toString(36))+'-'+i, nameFr:c.nameFr, nameEn:'', descFr:c.descFr, descEn:'', note:'', allergens:toAl(c.allergens), noAllergen:false, places:[],
              validation: ok ? 'validated' : 'todo', pub: ok ? 'published' : 'draft', validatedBy: ok ? user+' (import Excel)' : '', validatedAt: ok ? now : '' };
        db.recipes.push(r);
        logs.push({ recipeId:r.id, recipeName:r.nameFr, action:'Import Excel', detail:'Nouvelle recette'+(c.allergens.length ? ' · allergènes : '+c.allergens.join(', ') : ' · à compléter') });
      } else if (c.action === 'conflict' && r && replace && replace[c.idx]){
        const before = Object.keys(r.allergens||{}).join(', ') || 'aucun';
        r.allergens = toAl(c.allergens); r.noAllergen = false;
        const ok = plan.opts.markValidated;
        r.validation = ok ? 'validated' : 'revalidate';
        if (ok){ r.validatedBy = user+' (import Excel)'; r.validatedAt = now; }
        logs.push({ recipeId:r.id, recipeName:r.nameFr, action:'Import Excel', detail:'Allergènes remplacés : '+before+' → '+c.allergens.join(', ')+(ok ? '' : ' (à revalider)') });
      }
      if (r){
        c.places.forEach(function(p){ if (!r.places.some(function(q){ return q.m === p.m && q.f === p.f; })) r.places.push({ m:p.m, f:p.f }); });
      }
    });
    return logs;
  }

  function agmFiltered(a){
    const q = agNorm(a.q);
    return agDb.recipes.filter(function(r){
      if (a.fStatus === 'archived'){ if (r.pub !== 'archived') return false; }
      else if (r.pub === 'archived') return false;
      if (a.fMenu && !(r.places||[]).some(function(p){ return p.m === a.fMenu; })) return false;
      const st = a.fStatus;
      if (st === 'todo' && r.validation !== 'todo') return false;
      if (st === 'revalidate' && r.validation !== 'revalidate') return false;
      if (st === 'validated' && r.validation !== 'validated') return false;
      if (st === 'published' && !(r.pub === 'published' && r.validation === 'validated')) return false;
      if (st === 'hidden' && !(r.pub === 'hidden' || (r.pub === 'published' && r.validation !== 'validated'))) return false;
      if (st === 'draft' && r.pub !== 'draft') return false;
      if (st === 'supplier' && !Object.keys(r.allergens||{}).some(function(k){ return r.allergens[k] === 'supplier'; })) return false;
      if (q && agNorm(r.nameFr+' '+(r.nameEn||'')).indexOf(q) < 0 && agScore(a.q, r) === 0) return false;

  function agmUser(){ return state.name || 'Admin'; }
  function agmSummaryAl(al, no){ const k = Object.keys(al||{}); return k.length ? k.join(', ') : (no ? 'aucun (vérifié)' : 'aucun renseigné'); }
  window.agmType = function(){ agmSync(); agmPersist(); };

  async function agmApplyDraft(){
    // Enregistre le brouillon dans la base. Retourne { rec, changedAl } ou null si invalide.
    agmSync();
    const a = state.agm, d = a.draft;
    if (!d.nameFr.trim()){ a.err = 'Le nom français est obligatoire.'; a.msg = ''; agmRender(); return null; }
    let out = { rec:null, changedAl:false, created:false, before:'' };
    await agMutate(function(db){
      let r = d.id ? db.recipes.find(function(x){ return x.id === d.id; }) : null;
      if (!r){
        r = { id:'r-'+Date.now().toString(36)+Math.floor(Math.random()*1000), validation:'todo', pub:'draft', validatedBy:'', validatedAt:'' };
        db.recipes.push(r); out.created = true; d.id = r.id;
      }
      const oldKeys = Object.keys(r.allergens||{}).sort().join('|') + '#' + (r.noAllergen ? 1 : 0);
      out.before = agmSummaryAl(r.allergens, r.noAllergen);
      r.nameFr = d.nameFr.trim(); r.nameEn = d.nameEn.trim(); r.descFr = d.descFr.trim(); r.descEn = d.descEn.trim(); r.note = d.note.trim();
      r.allergens = JSON.parse(JSON.stringify(d.allergens)); r.noAllergen = !!d.noAllergen && Object.keys(d.allergens).length === 0;
      r.places = JSON.parse(JSON.stringify(d.places));
      const newKeys = Object.keys(r.allergens).sort().join('|') + '#' + (r.noAllergen ? 1 : 0);
      out.changedAl = oldKeys !== newKeys && !out.created;
      if (out.changedAl && r.validation === 'validated') r.validation = 'revalidate';
      out.rec = JSON.parse(JSON.stringify(r));
    });
    return out;
  }
  async function agmLogRec(rec, action, detail){
    await agLog([{ ts:new Date().toISOString(), when:nowLabel(), user:agmUser(), recipeId:rec.id, recipeName:rec.nameFr, action:action, detail:detail||'' }]);
  }
  async function agmReloadAfter(msg){
    const a = state.agm;
    a.err = ''; a.msg = msg || '';
    const rec = agDb.recipes.find(function(r){ return r.id === a.draft.id; });
    if (rec) a.draft = agmDraftFrom(rec);
    agmRender();
  }

  window.agmAct = async function(type, p1, p2, p3, p4){
    if (!state.adminUnlocked) return;
    const a = state.agm; if (!a) return;
    try {
      if (type === 'q'){ a.q = p1; const l = document.getElementById('agm-list'); if (l) l.innerHTML = agmListHtml(a); agmPersist(); return; }
      if (type === 'fMenu'){ a.fMenu = p1; a.msg = ''; }
      else if (type === 'fStatus'){ a.fStatus = p1; a.msg = ''; }
      else if (type === 'view'){
        agmSync(); a.view = p1; a.msg = ''; a.err = '';
        if (p1 === 'history') a.history = await agHistoryLoad();
        if (p1 === 'dash' || p1 === 'menus') agDb = await agLoad();
        if (p1 === 'import'){ a.imp = null; agImpPlanObj = null; }
        try { window.scrollTo(0,0); } catch(e){}
      }
      else if (type === 'signIn'){
        const em = (document.getElementById('agm-auth-email')||{}).value || ''; const pw = (document.getElementById('agm-auth-pw')||{}).value || '';
        if (!em.trim() || !pw){ a.err = 'Renseigne l\'email et le mot de passe.'; a.msg = ''; agmRender(); return; }
        try { localStorage.setItem('agAdminEmail', em.trim()); } catch(e){}
        try {
          await window.agAuth.signIn(em.trim(), pw);
          a.view = 'dash'; a.err = ''; a.msg = 'Connecté.';
        } catch(e){ a.err = 'Connexion refusée : email ou mot de passe incorrect.'; a.msg = ''; }
      }
      else if (type === 'impFiles'){
        const inp = document.getElementById('agm-imp-file'); const files = inp ? Array.prototype.slice.call(inp.files) : [];
        if (!files.length) return;
        a.msg = ''; a.err = ''; a.imp = { files:files.map(function(f){ return f.name; }), markValidated:true, replace:{}, busy:true }; agImpPlanObj = null; agmRender();
        try {
          const XLSX = await agLoadXlsx(); const sheets = [];
          for (let i=0;i<files.length;i++){
            const wb = XLSX.read(await files[i].arrayBuffer(), { type:'array' });
            wb.SheetNames.forEach(function(n){ sheets.push(agImpParseSheet(n, XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:null }))); });
          }
          agDb = await agLoad();
          agImpPlanObj = agImpPlan(agDb, sheets, { markValidated:true });
          a.imp.busy = false;
        } catch(e){ a.imp = null; a.err = 'Lecture impossible (fichier illisible ou lecteur Excel non chargé : vérifie ta connexion).'; }
      }
      else if (type === 'impValid'){ if (a.imp) a.imp.markValidated = !a.imp.markValidated; }
      else if (type === 'impReplace'){ if (a.imp){ a.imp.replace = a.imp.replace || {}; a.imp.replace[p1] = !a.imp.replace[p1]; } }
      else if (type === 'impApply'){
        if (!agImpPlanObj || !a.imp) return;
        if (!confirm('Confirmer l\'import ? Les nouvelles recettes seront ajoutées à la base.')) return;
        const plan = agImpPlanObj; plan.opts.markValidated = a.imp.markValidated;
        let logs = [];
        await agMutate(function(db){ logs = agImpApply(db, plan, a.imp.replace, agmUser()); });
        await agLog(logs.map(function(l){ return Object.assign({ ts:new Date().toISOString(), when:nowLabel(), user:agmUser() }, l); }));
        a.msg = 'Import terminé : '+plan.sum.newRec+' recette(s) créée(s), '+plan.sum.newPlaces+' placement(s), '+Object.keys(a.imp.replace||{}).filter(function(k){ return a.imp.replace[k]; }).length+' remplacement(s).';
        agImpPlanObj = null; a.imp = null; a.view = 'dash'; try { window.scrollTo(0,0); } catch(e){}
      }
      else if (type === 'new'){ a.draft = agmBlankDraft(); a.view = 'edit'; a.msg = ''; a.err = ''; try { window.scrollTo(0,0); } catch(e){} }
      else if (type === 'edit'){
        agDb = await agLoad();
        const r = agDb.recipes.find(function(x){ return x.id === p1; });
        if (r){ a.draft = agmDraftFrom(r); a.view = 'edit'; a.msg = ''; a.err = ''; try { window.scrollTo(0,0); } catch(e){} }
      }
      else if (type === 'tgl'){ agmSync(); if (a.draft.allergens[p1]) delete a.draft.allergens[p1]; else { a.draft.allergens[p1] = 'confirmed'; a.draft.noAllergen = false; } }
      else if (type === 'lvl'){ agmSync(); a.draft.allergens[p1] = p2; }
      else if (type === 'noAll'){ agmSync(); a.draft.noAllergen = !a.draft.noAllergen; if (a.draft.noAllergen) a.draft.allergens = {}; }
      else if (type === 'pl'){ agmSync(); const i = a.draft.places.findIndex(function(x){ return x.m === p1; }); if (i >= 0) a.draft.places.splice(i,1); else { const m = agMenu(p1); a.draft.places.push({ m:p1, f:m.families[0] ? m.families[0].id : '' }); } }
      else if (type === 'plf'){ agmSync(); const x = a.draft.places.find(function(q){ return q.m === p1; }); if (x) x.f = p2; }
      else if (type === 'save'){
        const res = await agmApplyDraft(); if (!res) return;
        await agmLogRec(res.rec, res.created ? 'Création' : 'Modification', res.changedAl ? 'Allergènes : '+res.before+' → '+agmSummaryAl(res.rec.allergens, res.rec.noAllergen)+(res.rec.validation==='revalidate' ? ' (masquée jusqu\'à revalidation)' : '') : '');
        await agmReloadAfter(res.changedAl && res.rec.validation === 'revalidate' ? 'Enregistré. Les allergènes ont changé : la recette est masquée côté Guest jusqu\'à revalidation.' : 'Enregistré.');
        return;
      }
      else if (type === 'validate'){
        const res = await agmApplyDraft(); if (!res) return;
        if (!Object.keys(res.rec.allergens).length && !res.rec.noAllergen){
          a.err = 'Coche au moins un allergène, ou « Aucun des 14 allergènes » si c\'est vérifié, avant de valider.'; a.msg = ''; agmRender(); return;
        }
        await agMutate(function(db){ const r = db.recipes.find(function(x){ return x.id === res.rec.id; }); r.validation = 'validated'; r.validatedBy = agmUser(); r.validatedAt = nowLabel(); });
        await agmLogRec(res.rec, 'Validation', 'Allergènes validés : '+agmSummaryAl(res.rec.allergens, res.rec.noAllergen));
        const published = res.rec.pub === 'published';
        await agmReloadAfter(published ? 'Validée. La recette est de nouveau visible côté Guest.' : 'Validée. Elle reste invisible tant que tu ne la publies pas.');
        return;
      }
      else if (type === 'publish'){
        const res = await agmApplyDraft(); if (!res) return;
        const cur = agDb.recipes.find(function(x){ return x.id === res.rec.id; });
        if (cur.validation !== 'validated'){ a.err = 'Valide d\'abord les allergènes : une recette non validée ne peut pas être publiée.'; a.msg = ''; agmRender(); return; }
        await agMutate(function(db){ db.recipes.find(function(x){ return x.id === res.rec.id; }).pub = 'published'; });
        await agmLogRec(res.rec, 'Publication', 'Visible côté Guest');
        await agmReloadAfter('Publiée : visible côté Guest.');
        return;
      }
      else if (type === 'hide' || type === 'archive' || type === 'restore'){
        if (type === 'archive' && !confirm('Archiver cette recette ? Elle ne sera plus visible côté Guest.')) return;
        const res = await agmApplyDraft(); if (!res) return;
        const target = type === 'archive' ? 'archived' : 'hidden';
        await agMutate(function(db){ db.recipes.find(function(x){ return x.id === res.rec.id; }).pub = target; });
        await agmLogRec(res.rec, type === 'hide' ? 'Masquage' : (type === 'archive' ? 'Archivage' : 'Restauration'), '');
        await agmReloadAfter(type === 'hide' ? 'Masquée côté Guest.' : (type === 'archive' ? 'Archivée.' : 'Restaurée (masquée).'));
        return;
      }
      else if (type === 'renMenu'){
        await agMutate(function(db){ const m = db.menus.find(function(x){ return x.id === p1; }); if (m) m[p2] = String(p3||'').trim() || (p2 === 'nameFr' ? m.nameFr : ''); });
        a.msg = 'Enregistré.'; a.err = '';
      }
      else if (type === 'renFam'){
        await agMutate(function(db){ const m = db.menus.find(function(x){ return x.id === p1; }); const f = m && m.families.find(function(x){ return x.id === p2; }); if (f) f[p4] = String(p3||'').trim() || (p4 === 'nameFr' ? f.nameFr : ''); });
        a.msg = 'Enregistré.'; a.err = '';
      }
      else if (type === 'addFam'){
        const n = (prompt('Nom de la nouvelle famille ?') || '').trim(); if (!n) return;
        await agMutate(function(db){ const m = db.menus.find(function(x){ return x.id === p1; }); if (m) m.families.push({ id:'f-'+Date.now().toString(36), nameFr:n, nameEn:'' }); });
        a.msg = 'Famille ajoutée.'; a.err = '';
      }
      else if (type === 'delFam'){
        const used = agDb.recipes.some(function(r){ return (r.places||[]).some(function(x){ return x.m === p1 && x.f === p2; }); });
        if (used){ a.err = 'Cette famille contient encore des recettes : déplace-les d\'abord.'; a.msg = ''; agmRender(); return; }
        if (!confirm('Retirer cette famille ?')) return;
        await agMutate(function(db){ const m = db.menus.find(function(x){ return x.id === p1; }); if (m) m.families = m.families.filter(function(f){ return f.id !== p2; }); });
        a.msg = 'Famille retirée.'; a.err = '';
      }
      else if (type === 'addMenu'){
        const n = (prompt(p1 === 'carte' ? 'Nom de la nouvelle carte ?' : 'Nom du nouveau menu groupe ?') || '').trim(); if (!n) return;
        const id = 'm-'+Date.now().toString(36);
        await agMutate(function(db){ db.menus.push({ id:id, type:p1, nameFr:n, nameEn:'', families:[ { id:id+'-1', nameFr:'Entrées', nameEn:'Starters' }, { id:id+'-2', nameFr:'Plats', nameEn:'' }, { id:id+'-3', nameFr:'Desserts', nameEn:'Desserts' } ] }); });
        a.msg = 'Ajouté.'; a.err = '';
      }
      else if (type === 'delMenu'){
        const used = agDb.recipes.some(function(r){ return (r.places||[]).some(function(x){ return x.m === p1; }); });
        if (used){ a.err = 'Ce menu contient encore des recettes : retire-les du menu d\'abord (fiche recette).'; a.msg = ''; agmRender(); return; }
        if (!confirm('Retirer ce menu ?')) return;
        await agMutate(function(db){ db.menus = db.menus.filter(function(m){ return m.id !== p1; }); });
        a.msg = 'Menu retiré.'; a.err = '';
      }
      agmRender();
    } catch(e){
      a.err = (window.agAuth ? 'Enregistrement refusé : ta connexion sécurisée a peut-être expiré. Reconnecte-toi (retour au menu Admin puis « Gérer les allergènes »).' : 'Erreur d\'enregistrement. Vérifie ta connexion et réessaie.'); a.msg = '';
      agmRender();
    }
  };

  function screenAgManager(){
    return '<div id="agm-root">'+agmHtml()+'</div>';
  }
  function screenAllergenesReadMamaGang(){
    let out = '<div style="padding:16px 16px 0"><div onclick="appAction(\'goHome\')" style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;width:fit-content">'+icon('back',18)+'<span>Retour</span></div></div>';
    out += '<div style="padding:10px 16px 6px;text-align:center">'+
      '<div class="copilote-script" style="font-size:30px">Copilote</div>'+
      '<h1 class="mama-title" style="font-size:18px;margin:6px 0 2px;color:var(--text-primary)">'+esc(agT('title'))+'</h1>'+
      '<p style="color:var(--text-secondary);font-size:13px;margin:0">'+esc(agT('sub'))+'</p></div>';
    out += '<div id="ag-root">'+agGuestHtml()+'</div>';
    out += bottomNav('home');
    return out;
  }
  async function renderPublicAllergenesPage(){
    const root = document.getElementById('app');
    let out = '<div style="padding:28px 16px 8px;text-align:center">'+
      '<div class="copilote-script" style="font-size:34px">Copilote</div>'+
      '<img src="'+LOGO_URI+'" alt="Mama Shelter Toulouse" style="width:70px;height:70px;object-fit:contain;display:block;margin:6px auto 0">'+
      '<h1 class="mama-title" style="font-size:18px;margin:14px 0 2px;color:var(--text-primary)">'+esc(agT('title'))+'</h1>'+
      '<p style="color:var(--text-secondary);font-size:13px;margin:0">'+esc(agT('sub'))+'</p></div>';
    root.innerHTML = out + '<div id="ag-root"><div style="padding:24px;text-align:center;color:var(--text-muted)">'+esc(agT('loading'))+'</div></div>';
    try {
      agDb = await agLoad();
      agLastJson = JSON.stringify(agDb);
      agRerender();
    } catch(e){
      const el = document.getElementById('ag-root');
      if (el) el.innerHTML = '<div style="margin:16px;padding:16px;border-radius:12px;background:#FDECEA;color:#8C1D18;font-size:14px;font-weight:600;text-align:center">'+esc(agT('error'))+'</div>';
    }
  }

  const publicUrlParams = new URLSearchParams(window.location.search);
  const isPublicAllergenesMode = publicUrlParams.has('allergenes') || window.location.hash.replace('#','').toLowerCase() === 'allergenes';
  if (isPublicAllergenesMode){
    renderPublicAllergenesPage();
  } else {
    init();
  }
})();
